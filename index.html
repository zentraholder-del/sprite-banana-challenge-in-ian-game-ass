<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Calculator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    /* NAV */
    nav {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 32px;
      height: 52px;
    }

    .logo {
      font-size: 15px;
      font-weight: 600;
      color: #1a56db;
      letter-spacing: -0.3px;
      cursor: default;
      user-select: none;
    }

    nav a {
      font-size: 13px;
      color: #555;
      text-decoration: none;
    }

    nav a:hover { color: #1a56db; }

    /* MAIN LAYOUT */
    .page {
      max-width: 900px;
      margin: 36px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 32px;
      align-items: start;
    }

    /* CALCULATOR */
    .calc-wrap {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .calc-header {
      background: #1a56db;
      padding: 10px 16px;
      font-size: 12px;
      color: rgba(255,255,255,0.8);
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .display {
      background: #1e1e2e;
      padding: 16px;
      text-align: right;
    }

    .display .expr {
      font-size: 12px;
      color: #888;
      min-height: 18px;
      margin-bottom: 4px;
    }

    .display .result {
      font-size: 32px;
      color: #fff;
      font-weight: 300;
      letter-spacing: -1px;
      word-break: break-all;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    button {
      border: none;
      border-top: 1px solid #eee;
      border-right: 1px solid #eee;
      background: #fff;
      padding: 16px 0;
      font-size: 15px;
      cursor: pointer;
      color: #222;
      transition: background 0.1s;
    }

    button:hover { background: #f0f4ff; }
    button:active { background: #dce8ff; }

    button.op { color: #1a56db; font-weight: 500; }
    button.eq { background: #1a56db; color: #fff; font-weight: 600; }
    button.eq:hover { background: #1344b8; }
    button.clear { color: #c0392b; font-weight: 500; }

    /* SIDEBAR INFO */
    .info h1 {
      font-size: 20px;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
    }

    .info p {
      font-size: 13px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .info-box {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    .info-box h3 {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    .info-box ul {
      list-style: none;
      font-size: 13px;
      color: #555;
    }

    .info-box ul li {
      padding: 4px 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .info-box ul li:last-child { border-bottom: none; }

    .info-box ul li span {
      float: right;
      color: #1a56db;
      font-weight: 500;
    }

    /* FOOTER */
    footer {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      padding: 32px 0 20px;
    }

    footer a { color: #aaa; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <nav>
    <div class="logo" id="logo" onclick="handleSecret()">Online-Calculator.net</div>
  </nav>

  <div class="page">

    <!-- CALCULATOR -->
    <div>
      <div class="calc-wrap">
        <div class="calc-header">Standard Calculator</div>
        <div class="display">
          <div class="expr" id="expr"></div>
          <div class="result" id="result">0</div>
        </div>
        <div class="buttons">
          <button class="clear" onclick="clearAll()">AC</button>
          <button class="op" onclick="toggleSign()">+/−</button>
          <button class="op" onclick="percent()">%</button>
          <button class="op" onclick="inputOp('/')">÷</button>

          <button onclick="inputNum('7')">7</button>
          <button onclick="inputNum('8')">8</button>
          <button onclick="inputNum('9')">9</button>
          <button class="op" onclick="inputOp('*')">×</button>

          <button onclick="inputNum('4')">4</button>
          <button onclick="inputNum('5')">5</button>
          <button onclick="inputNum('6')">6</button>
          <button class="op" onclick="inputOp('-')">−</button>

          <button onclick="inputNum('1')">1</button>
          <button onclick="inputNum('2')">2</button>
          <button onclick="inputNum('3')">3</button>
          <button class="op" onclick="inputOp('+')">+</button>

          <button style="grid-column: span 2" onclick="inputNum('0')">0</button>
          <button onclick="inputDot()">.</button>
          <button class="eq" onclick="calculate()">=</button>
        </div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="info">
      <h1>Free Online Calculator</h1>
      <p>A simple, fast and reliable calculator for everyday use. No download required — works directly in your browser.</p>


    </div>

  </div>

  <footer>
    &copy; 2026 Online-Calculator.net &nbsp;|&nbsp;
    <a href="#">Privacy Policy</a> &nbsp;|&nbsp;
    <a href="#">Contact</a>
  </footer>

  <script>
    let current = '0';
    let expr = '';
    let operator = null;
    let prev = null;
    let freshCalc = false;

    function updateDisplay() {
      document.getElementById('result').textContent = current;
      document.getElementById('expr').textContent = expr;
    }

    function inputNum(n) {
      if (freshCalc) { current = n; expr = ''; freshCalc = false; }
      else current = (current === '0') ? n : current + n;
      updateDisplay();
    }

    function inputDot() {
      if (!current.includes('.')) current += '.';
      updateDisplay();
    }

    function inputOp(op) {
      prev = parseFloat(current);
      operator = op;
      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      expr = current + ' ' + symbols[op];
      current = '0';
      freshCalc = false;
      updateDisplay();
    }

    function calculate() {
      if (operator === null || prev === null) return;
      const cur = parseFloat(current);
      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      expr = prev + ' ' + symbols[operator] + ' ' + cur + ' =';
      let res;
      if (operator === '+') res = prev + cur;
      if (operator === '-') res = prev - cur;
      if (operator === '*') res = prev * cur;
      if (operator === '/') res = cur !== 0 ? prev / cur : 'Error';
      current = typeof res === 'number' ? parseFloat(res.toFixed(10)).toString() : res;
      operator = null; prev = null; freshCalc = true;
      updateDisplay();
    }

    function clearAll() {
      current = '0'; expr = ''; operator = null; prev = null; freshCalc = false;
      updateDisplay();
    }

    function toggleSign() {
      current = (parseFloat(current) * -1).toString();
      updateDisplay();
    }

    function percent() {
      current = (parseFloat(current) / 100).toString();
      updateDisplay();
    }



    // Secret trigger — click logo 5 times
    let clicks = 0;
    let timer;
    function handleSecret() {
      clicks++;
      clearTimeout(timer);
      timer = setTimeout(() => { clicks = 0; }, 1500);
      if (clicks >= 5) {
        clicks = 0;
        window.location.href = 'games/index.html';
      }
    }
  </script>

</body>
</html>
