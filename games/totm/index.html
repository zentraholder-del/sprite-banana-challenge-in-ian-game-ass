<!DOCTYPE html>
<base href="https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/tomb/">
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link href="style.css" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; 
      background: black;
    }
    #gameContainer {
      width: 100vw;
      height: 100vh;
    }

    /* Mobile Notice Styling */
    #mobile-notice {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.85);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-family: sans-serif;
      font-weight: bold;
      text-align: center;
      z-index: 9999;
      pointer-events: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 2px solid white;
      width: 80%;
      max-width: 400px;
    }

    #close-notice {
      display: block;
      margin-top: 8px;
      font-size: 0.8em;
      text-decoration: underline;
      cursor: pointer;
      opacity: 0.8;
    }
  </style>
</head>
<body dir="ltr">

  <div id="mobile-notice">
    ⚠️ MOBILE CONTROLS INVERTED:<br>
    Swipe Left = Right | Swipe Right = Left<br>
    Swipe Up = Down | Swipe Down = Up
    <span id="close-notice" onclick="this.parentElement.style.display='none'">[ Dismiss ]</span>
  </div>

  <script src="UnityProgress.js"></script>
  <script src="UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "totm.json", {
      onProgress: UnityProgress,
      Module: {
        onRuntimeInitialized: function() {
          UnityProgress(gameInstance, "complete");
        }
      }
    });
  </script>

  <div class="webgl-content">
    <div id="gameContainer"></div>
  </div>
</body>
</html>
