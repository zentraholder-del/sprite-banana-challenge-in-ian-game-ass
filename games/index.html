<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <title>Lightspeed</title>
  <style>
    /* ===== SHARED DESIGN TOKENS (identical in all 4 files — do not drift) ===== */
    :root {
      --bg-base: #08080c;
      --surface: #111117;
      --surface-2: #16161e;
      --border-subtle: #1c1c26;
      --border-strong: #7c3aed;
      --text-primary: #f0f0f8;
      --text-secondary: #9494ad;
      --text-muted: #5c5c72;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-pressed: #5b21b6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --rank-owner: #f59e0b;
      --rank-admin: #7c3aed;
      --rank-mod: #10b981;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --t-micro: 0.15s;
      --t-standard: 0.25s;
      --t-entrance: 0.35s;
    }
    body { font-family: var(--font-sans) !important; }
    h1, h2, h3 { letter-spacing: -0.02em; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #080810;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
    }

    /* Background glow blobs */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.22;
    }
    .blob1 { width: 460px; height: 460px; background: #7c3aed; top: -100px; left: -120px; }
    .blob2 { width: 400px; height: 400px; background: #2563eb; bottom: -80px; right: -100px; }
    .blob3 { width: 240px; height: 240px; background: #a78bfa; top: 50%; left: 50%; transform: translate(-50%,-50%); }

    /* CARD */
    .card {
      position: relative;
      z-index: 1;
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 45%, rgba(124,58,237,0.07));
      background-color: rgba(14,14,26,0.5);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 24px;
      padding: 44px 40px;
      width: 100%;
      max-width: 440px;
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 48px rgba(0,0,0,0.5), 0 32px 96px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -1px 0 rgba(255,255,255,0.04);
    }

    .logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 6px rgba(0,0,0,0.4), 0 8px 24px rgba(124,58,237,0.45);
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo p {
      font-size: 13px;
      color: #4b5563;
      margin-top: 5px;
    }

    /* INPUT */
    .field { margin-bottom: 14px; }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      margin-bottom: 7px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      background: linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      background-color: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 13px 16px;
      font-size: 15px;
      color: #fff;
      outline: none;
      transition: border-color 0.3s cubic-bezier(0.22, 1.15, 0.36, 1), box-shadow 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
      font-family: monospace;
    }

    .input-wrap input.mono {
      letter-spacing: 3px;
      font-family: monospace;
    }

    .input-wrap input::placeholder {
      letter-spacing: 0;
      color: #374151;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    .input-wrap input:focus {
      border-color: rgba(124,58,237,0.65);
      box-shadow: 0 0 0 4px rgba(124,58,237,0.16), inset 0 1px 0 rgba(255,255,255,0.08), 0 4px 20px rgba(124,58,237,0.2);
    }

    .input-wrap input.error-input {
      border-color: rgba(239,68,68,0.6);
      box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
    }

    /* BUTTON */
    .btn {
      width: 100%;
      margin-top: 6px;
      padding: 14px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -1px 0 rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 8px 24px rgba(124,58,237,0.4);
      letter-spacing: 0.2px;
    }

    .btn:hover {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), inset 0 -1px 0 rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 12px 32px rgba(124,58,237,0.55);
    }

    .btn:active { opacity: 0.9; transform: translateY(0) scale(0.98); }

    .btn:disabled { opacity: 0.55; cursor: wait; transform: none; }

    .error-msg {
      margin-top: 10px;
      font-size: 12.5px;
      color: #f87171;
      text-align: center;
      min-height: 18px;
      transition: opacity 0.2s;
    }

    .status-msg {
      margin-top: 10px;
      font-size: 12.5px;
      color: #93c5fd;
      text-align: center;
      min-height: 18px;
    }

    /* DIVIDER */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }
    .divider span {
      font-size: 11px;
      color: #374151;
      letter-spacing: 0.5px;
    }

    /* REQUEST LINK */
    .request-link {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
    }
    .request-link button {
      background: none;
      border: none;
      color: #a78bfa;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: color 0.15s;
      padding: 0;
    }
    .request-link button:hover { color: #c4b5fd; }

    /* MODAL OVERLAY */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(24px) saturate(1.3);
      -webkit-backdrop-filter: blur(24px) saturate(1.3);
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .overlay.show {
      display: flex;
      opacity: 0;
    }
    .overlay.visible {
      opacity: 1;
    }

    .modal {
      background: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02) 45%, rgba(124,58,237,0.08));
      background-color: rgba(17,17,24,0.72);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 36px 32px;
      width: 100%;
      max-width: 360px;
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 48px rgba(0,0,0,0.55), 0 32px 96px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(255,255,255,0.04);
      transform: translateY(20px);
      transition: transform 0.25s ease-out, opacity 0.25s ease-out;
      opacity: 0;
      position: relative;
    }
    .overlay.visible .modal {
      transform: translateY(0);
      opacity: 1;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(255,255,255,0.06);
      border: none;
      color: #6b7280;
      font-size: 16px;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .modal h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #fff;
    }
    .modal > p {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .modal .field input,
    .modal .field textarea {
      width: 100%;
      background: linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      background-color: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: border-color 0.3s cubic-bezier(0.22, 1.15, 0.36, 1), box-shadow 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      letter-spacing: 0;
    }
    .modal .field input:focus,
    .modal .field textarea:focus {
      border-color: rgba(124,58,237,0.65);
      box-shadow: 0 0 0 4px rgba(124,58,237,0.16), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .modal .field input::placeholder,
    .modal .field textarea::placeholder { color: #374151; }

    .modal .field textarea {
      resize: none;
      height: 90px;
    }

    .success-state {
      display: none;
      text-align: center;
      padding: 10px 0;
    }
    .success-state .tick {
      font-size: 36px;
      margin-bottom: 12px;
    }
    .success-state h3 {
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }
    .success-state p {
      font-size: 13px;
      color: #4b5563;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      font-size: 11px;
      color: #6b6b8a;
      letter-spacing: 0.5px;
    }

    /* ===== FLAT DESIGN OVERRIDE (no glow, no blur, no shadow) ===== */
    body { background: #0a0a0f !important; color: #e2e2f0 !important; animation: pageIn 0.3s ease-out; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .bg, .blob { display: none !important; }
    * { text-shadow: none !important; }
    .card, .modal {
      background: #13131a !important;
      border: 1px solid #1e1e2e !important;
      border-radius: 16px !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    .overlay { background: rgba(0,0,0,0.7) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
    .modal { animation: modalUp 0.2s cubic-bezier(0.22,1,0.36,1) !important; }
    @keyframes modalUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    .logo h1 { background: none !important; -webkit-text-fill-color: #e2e2f0 !important; color: #e2e2f0 !important; }
    .logo-icon { background: #7c3aed !important; border: none !important; box-shadow: none !important; }
    .logo p { color: #6b6b8a !important; }
    .field label { color: #6b6b8a !important; }
    .input-wrap input, .modal .field input, .modal .field textarea {
      background: #1a1a24 !important;
      border: 1.5px solid #2a2a3d !important;
      border-radius: 10px !important;
      box-shadow: none !important;
      color: #e2e2f0 !important;
      min-height: 44px;
      transition: border-color 0.2s cubic-bezier(0.22,1,0.36,1) !important;
    }
    .input-wrap input:focus, .modal .field input:focus, .modal .field textarea:focus {
      border-color: #7c3aed !important;
      box-shadow: none !important;
    }
    .btn {
      background: #7c3aed !important;
      border: none !important;
      border-radius: 10px !important;
      box-shadow: none !important;
      min-height: 44px;
      transition: background 0.2s cubic-bezier(0.22,1,0.36,1), transform 0.2s cubic-bezier(0.22,1,0.36,1) !important;
    }
    .btn:hover { background: #6d28d9 !important; transform: none !important; box-shadow: none !important; }
    .btn:active { transform: scale(0.97) !important; }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .modal-close { min-width: 44px; min-height: 44px; }
    .request-link button { min-height: 44px; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #2a2a3d; }
    ::-webkit-scrollbar-thumb { background: #7c3aed; border-radius: 8px; }
    /* request status banners */
    #reqStatusWrap { position: relative; z-index: 1; width: 100%; max-width: 400px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .req-banner {
      background: #13131a; border: 1px solid #1e1e2e; border-radius: 16px;
      padding: 14px 16px; font-size: 13px; color: #e2e2f0; line-height: 1.5;
      animation: pageIn 0.2s cubic-bezier(0.22,1,0.36,1);
    }
    .req-banner.muted-note { color: #6b6b8a; text-align: center; }
    .req-banner.denied { border-left: 4px solid #ef4444; }
    .req-banner.approved { border-left: 4px solid #10b981; }
    .keyline, .req-banner .keyline {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin-top: 10px; background: #1a1a24; border: 1px solid #2a2a3d;
      border-radius: 10px; padding: 10px 12px; font-family: monospace; font-size: 14px;
    }
    .req-banner button { min-height: 44px; }
    .mini-btn {
      background: #7c3aed; border: none; border-radius: 10px; color: #fff;
      font-size: 13px; font-weight: 600; padding: 10px 14px; cursor: pointer; min-height: 44px;
      transition: background 0.2s cubic-bezier(0.22,1,0.36,1), transform 0.2s cubic-bezier(0.22,1,0.36,1);
    }
    .mini-btn:hover { background: #6d28d9; }
    .mini-btn:active { transform: scale(0.97); }
    .mini-btn.ghost { background: #1a1a24; border: 1.5px solid #2a2a3d; }
    /* toasts */
    #toastWrap { position: fixed; top: 16px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: #13131a; border: 1px solid #1e1e2e; border-radius: 16px;
      padding: 12px 16px; font-size: 13px; color: #e2e2f0; max-width: 300px;
      animation: toastIn 0.25s ease-out;
      transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    }
    .toast.err { border-left: 4px solid #ef4444; }
    .toast.ok { border-left: 4px solid #10b981; }
    .toast.out { opacity: 0; transform: translateX(110%); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(110%); } to { opacity: 1; transform: translateX(0); } }
    /* custom dropdown (same component language as the admin panel) */
    .dd { position: relative; }
    .dd-trigger {
      width: 100%; min-height: 48px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: #1a1a24; border: 1.5px solid #2a2a3d; border-radius: 10px;
      padding: 12px 14px; font-size: 16px; color: #e2e2f0; cursor: pointer; font-family: inherit;
      transition: border-color 0.2s cubic-bezier(0.22,1,0.36,1);
      touch-action: manipulation;
    }
    .dd-trigger:hover { border-color: #7c3aed; }
    .dd.open .dd-trigger { border-color: #7c3aed; }
    .dd-trigger .chev { font-style: normal; color: #6b6b8a; transition: transform 0.2s cubic-bezier(0.22,1,0.36,1), color 0.2s cubic-bezier(0.22,1,0.36,1); }
    .dd.open .chev { transform: rotate(180deg); color: #e2e2f0; }
    .dd-panel {
      position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 60;
      background: #13131a; border: 1px solid #2a2a3d; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      display: none; max-height: 240px; overflow-y: auto;
      transform-origin: top;
    }
    .dd.open .dd-panel { display: block; animation: ddOpen 0.15s ease-out; }
    @keyframes ddOpen { from { opacity: 0; transform: scaleY(0); } to { opacity: 1; transform: scaleY(1); } }
    .dd-opt {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; padding: 10px 14px; background: none; border: none;
      font-size: 14px; color: #e2e2f0; cursor: pointer; min-height: 44px; text-align: left;
      font-family: inherit;
      transition: background 0.15s ease-out;
      touch-action: manipulation;
    }
    .dd-opt:hover { background: #1e1e2e; }
    .dd-opt.sel { color: #7c3aed; font-weight: 600; }
    .dd-opt .tick { visibility: hidden; }
    .dd-opt.sel .tick { visibility: visible; }

    /* ===== SECTION 3: two-tab auth + mesh background ===== */
    .mesh {
      position: fixed;
      inset: -10%;
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
      background:
        radial-gradient(420px 420px at 20% 25%, rgba(124,58,237,0.16), transparent 70%),
        radial-gradient(520px 520px at 80% 70%, rgba(37,99,235,0.12), transparent 70%),
        radial-gradient(360px 360px at 60% 10%, rgba(167,139,250,0.1), transparent 70%);
      animation: meshDrift 26s ease-in-out infinite alternate;
    }
    @keyframes meshDrift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to { transform: translate3d(2%, 2%, 0) scale(1.06); }
    }
    .authtabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }
    .authtab {
      flex: 1;
      min-height: 48px;
      background: #1a1a24;
      border: 1.5px solid #2a2a3d;
      border-radius: 12px;
      color: #6b6b8a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s cubic-bezier(0.22,1,0.36,1), color 0.2s cubic-bezier(0.22,1,0.36,1), border-color 0.2s cubic-bezier(0.22,1,0.36,1), transform 0.2s cubic-bezier(0.22,1,0.36,1);
      touch-action: manipulation;
    }
    .authtab:hover { color: #e2e2f0; }
    .authtab:active { transform: scale(0.97); }
    .authtab.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .pane { display: none; }
    .pane.active { display: block; animation: paneIn 0.25s ease-out; }
    @keyframes paneIn {
      from { opacity: 0; transform: translateX(14px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .btn .spin {
      display: inline-block;
      width: 15px;
      height: 15px;
      margin-right: 8px;
      vertical-align: -2px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: #fff;
      animation: btnSpin 0.7s linear infinite;
    }
    @keyframes btnSpin { to { transform: rotate(360deg); } }
    .input-wrap input.error-input { border-color: #ef4444 !important; }
    @keyframes shakeX {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }

  <script>
    // ── Fill these in ──────────────────────────────────────────────
    const SUPABASE_URL = "https://hqjclkkwsepdhtwnwsvp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxamNsa2t3c2VwZGh0d253c3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTY5NTMsImV4cCI6MjEwNTc3Mjk1M30.-OXxTRYmIi4snwJSiThFsAPr5YgVbwz4kwUY_DURFRA";
    // Assumes tables: license_keys(key, used_by, is_active, is_admin, rank,
    //   username, session_token, activated_at, plaintext_reveal, request_id),
    //   blacklist(username), key_requests(name, reason, status).

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Typing-safe rendering: only touch the DOM when the markup actually
    // changed, so heartbeat polls never steal focus or reset scroll.
    function setHTMLifChanged(el, html) {
      if (!el) return false;
      if (el._lastHtml === html) return false;
      el._lastHtml = html;
      el.innerHTML = html;
      return true;
    }

    function toast(msg, kind) {
      const wrap = document.getElementById('toastWrap');
      if (!wrap) return;

      setTimeout(() => {

        t.classList.add('out');
        setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 200);
      }, 3000);

    /* ---------- device fingerprint (anti key-sharing lock) ----------
       ~15 independent signals hashed into one device id. Same device
       returning gets back in (token rotates); any other device on an
       active key stays blocked. No permissions needed, nothing uploaded
       except the final hash stored on the key's own row. */

    async function sha256hexFp(str) {
      const data = new TextEncoder().encode(str);
      const hash = await crypto.subtle.digest('SHA-256', data);
      return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function canvasFp() {
      try {
        const c = document.createElement('canvas');
        c.width = 280; c.height = 60;
        const x = c.getContext('2d');
        x.textBaseline = 'top';
        x.font = '14px Arial';
        x.fillStyle = '#f60';
        x.fillRect(10, 10, 60, 30);
        x.fillStyle = '#069';
        x.fillText('Lightspeed <fp> 123', 8, 8);
        x.strokeStyle = '#000';
        x.beginPath();
        x.arc(200, 30, 20, 0, Math.PI * 2);
        x.stroke();
        const g = x.createLinearGradient(0, 0, 280, 0);
        g.addColorStop(0, '#ff0000');
        g.addColorStop(1, '#0000ff');
        x.fillStyle = g;
        x.fillRect(0, 50, 280, 10);
        return c.toDataURL();
      } catch (e) { return 'nocanvas'; }
    }

    function webglFp() {
      try {
        const c = document.createElement('canvas');
        const gl = c.getContext('webgl2') || c.getContext('webgl');
        if (!gl) return 'nowebgl';
        const parts = [];
        parts.push(gl.getParameter(gl.VERSION));
        parts.push(gl.getParameter(gl.SHADING_LANGUAGE_VERSION));
        parts.push(gl.getParameter(gl.VENDOR));
        parts.push(gl.getParameter(gl.RENDERER));
        parts.push(gl.getParameter(gl.MAX_TEXTURE_SIZE));
        parts.push(gl.getParameter(gl.MAX_VIEWPORT_DIMS));
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        if (dbg) {
          parts.push(gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL));
          parts.push(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL));
        }
        const exts = gl.getSupportedExtensions() || [];
        parts.push(exts.slice().sort().join(','));
        try {
          const prec = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
          if (prec) parts.push([prec.precision, prec.rangeMin, prec.rangeMax].join('/'));
        } catch (e) {}
        parts.push((typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext) ? 'webgl2' : 'webgl1');
        return parts.join('~');
      } catch (e) { return 'webgl-err'; }
    }

    function audioFp() {
      // Offline-rendered oscillator fingerprint — no sound ever plays.
      try {
        const AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!AC) return Promise.resolve('noaudioctx');
        const ctx = new AC(1, 5000, 44100);
        const osc = ctx.createOscillator();
        osc.type = 'triangle';
        osc.frequency.value = 1000;
        const comp = ctx.createDynamicsCompressor();
        osc.connect(comp);
        comp.connect(ctx.destination);
        osc.start(0);
        return ctx.startRendering().then(buf => {
          const d = buf.getChannelData(0);
          let h = 0;
          for (let i = 0; i < d.length; i += 7) {
            h = ((h * 31) + Math.floor(d[i] * 100000)) | 0;
          }
          return 'audio:' + (h >>> 0).toString(16);
        }).catch(() => 'audio-err');
      } catch (e) { return Promise.resolve('audio-err'); }
    }

    function fontFp() {
      try {
        const base = ['monospace', 'sans-serif', 'serif'];
        const test = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Georgia',
          'Comic Sans MS', 'Impact', 'Trebuchet MS', 'Palatino', 'Garamond', 'Tahoma',
          'Calibri', 'Cambria', 'Consolas', 'Segoe UI', 'Helvetica', 'Menlo',
          'Roboto', 'Ubuntu', 'Lato', 'Open Sans', 'Noto Sans', 'Symbol', 'Webdings'];
        const c = document.createElement('canvas');
        const x = c.getContext('2d');
        const probe = 'mmmmmmmmmmlli';
        const widths = {};
        base.forEach(b => { x.font = '72px ' + b; widths[b] = x.measureText(probe).width; });
        const present = test.filter(f => base.some(b => {
          x.font = '72px "' + f + '", ' + b;
          return x.measureText(probe).width !== widths[b];
        }));
        // NOTE: document.fonts.size intentionally excluded — it changes as
        // webfonts finish loading, which would destabilise the fingerprint.
        return present.sort().join(',');
      } catch (e) { return 'fonts-err'; }
    }

    async function getDeviceFingerprint() {
      const nav = navigator;
      const parts = [
        'ua=' + (nav.userAgent || ''),
        'plat=' + (nav.platform || ''),
        'vendor=' + (nav.vendor || ''),
        'lang=' + (nav.language || '') + '/' + ((nav.languages || []).join(',')),
        'hw=' + (nav.hardwareConcurrency || '') + '/' + (nav.deviceMemory || ''),
        'touch=' + (nav.maxTouchPoints || 0),
        'dnt=' + (nav.doNotTrack || ''),
        'webdriver=' + (!!nav.webdriver),
        // Screen dims orientation-invariant (max/min): iPads rotate constantly
        // and iOS may report width/height per current orientation.
        'scr=' + Math.max(screen.width, screen.height) + 'x' + Math.min(screen.width, screen.height) + 'x' + screen.colorDepth + '@' + (window.devicePixelRatio || 1),
        'avail=' + Math.max(screen.availWidth || 0, screen.availHeight || 0) + 'x' + Math.min(screen.availWidth || 0, screen.availHeight || 0),
        'tz=' + new Date().getTimezoneOffset() + '/' + ((typeof Intl !== 'undefined' && Intl.DateTimeFormat().resolvedOptions().timeZone) || ''),
        'ck=' + (navigator.cookieEnabled ? 1 : 0),
        'plugins=' + ((navigator.plugins && navigator.plugins.length) || 0),
        'canvas=' + canvasFp(),
        'webgl=' + webglFp(),
        'fonts=' + fontFp()
      ];
      let audio = 'audio:skip';
      // No timeout race here on purpose: a race can resolve differently on
      // fast vs slow runs and would destabilise the fingerprint (same device,
      // different hash = legit user locked out). Offline renders complete.
      try { audio = await audioFp(); } catch (e) { audio = 'audio-err'; }
      parts.push(audio);
      const raw = parts.join('||');
      try {
        if (window.crypto && crypto.subtle) return await sha256hexFp(raw);
      } catch (e) {}
      let h1 = 0x811c9dc5;
      for (let i = 0; i < raw.length; i++) { h1 ^= raw.charCodeAt(i); h1 = Math.imul(h1, 0x01000193) >>> 0; }
      return 'fnv1a:' + h1.toString(16);
    }

    function showError(msg) {

    // Auto-redirect if a valid session token is already stored.
    // Owner/admin/mod go to the admin panel, everyone else to games.
    async function checkExistingSession() {
      const token = localStorage.getItem(LS_TOKEN);
      if (!token) return;
      let me = '';
      try { me = localStorage.getItem(LS_USER) || ''; } catch (e) {}
      showStatus('Checking saved session…');
      try {
        const { data, error } = await sb.rpc('verify_session', { input_username: me, input_token: token });
        if (error) throw error;
        if (data && data.valid) {
          if (data.used_by) { try { localStorage.setItem(LS_USER, data.used_by); } catch (e) {} }
          const rank = data.rank || (data.is_admin ? 'admin' : 'user');
          try { localStorage.setItem(LS_RANK, rank); } catch (e) {}
          if (rank !== 'owner') {
            try {
              const lk = await sb.from('app_config').select('locked, lock_message').eq('id', 1).maybeSingle();
              if (!lk.error && lk.data && lk.data.locked) {
                localStorage.removeItem(LS_TOKEN);
                localStorage.removeItem(LS_USER);
                try { localStorage.removeItem(LS_RANK); } catch (e) {}
                document.getElementById('status').textContent = lk.data.lock_message || 'Site is temporarily locked by the owner.';
                return;
              }
            } catch (e) { console.error('lock check failed (fail-open):', e); }
          }
          const elevated = rank === 'owner' || rank === 'admin' || rank === 'mod' || data.is_admin;
          clearRequestState();
          window.location.href = elevated ? '../admin/index.html' : 'play/';
        } else {
          localStorage.removeItem(LS_TOKEN);
          localStorage.removeItem(LS_USER);
          try { localStorage.removeItem(LS_RANK); } catch (e) {}
          document.getElementById('status').textContent = '';
        }
      } catch (e) {
        // Stay on login; surface only config-like errors, not the token itself
        document.getElementById('status').textContent = '';
      }
    }

    /* Request state: a pending_request_name left in storage would keep
       showing the approved banner/modal forever — even after the key is in
       hand. Any successful auth clears it. */
    function clearRequestState() {
      try {
        const n = localStorage.getItem('pending_request_name');
        if (n) localStorage.removeItem('request_dismissed_' + n);
        localStorage.removeItem('pending_request_name');

    async function tryLogin() {
      clearMessages();
      const username = document.getElementById('usernameInput').value.trim();
      const rawKey = document.getElementById('keyInput').value.trim();
      const input = document.getElementById('keyInput');
      const btn = document.getElementById('loginBtn');

      if (!username) {
        showError('Enter a username first.');
        document.getElementById('usernameInput').classList.add('error-input');
        authShake();
        return;
      }
      if (!rawKey) {
        showError('Enter your access key.');
        input.classList.add('error-input');
        authShake();
        return;
      }

      setLoginBusy(true);
      showStatus('Verifying…');

      try {
        // Single server-side validation: blacklist, key lookup, site lock,
        // username bind, device fingerprint — all enforced in validate_key.
        showStatus('Checking this device…');
        const fp = await getDeviceFingerprint();
        const { data: res, error: rpcErr } = await sb.rpc('validate_key', {
          input_key: rawKey, input_username: username, input_fp: fp
        });
        if (rpcErr) throw rpcErr;
        if (!res || !res.success) {
          const code = (res && res.error) || 'failed';
          if (code === 'blacklisted') {
            showError('This username is blacklisted.');
          } else if (code === 'invalid') {
            showError('Invalid key — request access below.');
            input.classList.add('error-input');
            toast('Key not found or already in use.', 'err');
            authShake();
          } else if (code === 'deactivated') {
            showError('This key has been deactivated.');
          } else if (code === 'locked') {
            showError((res && res.lock_message) || 'Site is temporarily locked by the owner.');
          } else if (code === 'wrong_user') {
            showError('This key belongs to "' + ((res && res.bound) || 'another name') + '". Use that name, or ask staff to reset the key.');
          } else if (code === 'other_device') {
            showError('This key is already active on another device.');
          } else {
            showError('Login failed. Try again.');
          }
          setLoginBusy(false);
          return;
        }
        if (res.welcome_back) showStatus('Welcome back — restoring your session…');

        const token = res.session_token;
        localStorage.setItem(LS_TOKEN, token);
        localStorage.setItem(LS_USER, username);
        clearRequestState();
        const myRank = res.rank || (res.is_admin ? 'admin' : 'user');
        try { localStorage.setItem(LS_RANK, myRank); } catch (e) {}
        // Drop legacy stub flag if present
        try { sessionStorage.removeItem('ls_auth'); } catch (e) {}
        // Owner/admin/mod land on the admin panel, everyone else on games.
        const elevated = myRank === 'owner' || myRank === 'admin' || myRank === 'mod' || res.is_admin;
        window.location.href = elevated ? '../admin/index.html' : 'play/';
      } catch (e) {
        console.error(e);
        // Surface the real reason (e.g. missing column / RLS block storable
        // as text) instead of a generic connection message.
        let detail = '';
        try { detail = (e && (e.message || e.error_description || e.hint)) || ''; } catch (x) {}
        detail = String(detail).slice(0, 160);
        showError('Login failed' + (detail ? ': ' + detail : '. Check your connection and try again.'));
        toast('Login failed. Check your connection.', 'err');
        setLoginBusy(false);
      }
    }

    document.getElementById('keyInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') tryLogin();
    });
    document.getElementById('usernameInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') tryLogin();

        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dd-opt' + (o.value === sel.value ? ' sel' : '');
        const s = document.createElement('span');
        s.textContent = o.textContent;
        const tick = document.createElement('span');
        tick.className = 'tick';
        tick.textContent = '✓';
        b.appendChild(s);
        b.appendChild(tick);
        b.onclick = (function (val) {
          return function (ev) {
            ev.stopPropagation();
            sel.value = val;
            syncSchoolDD();
            dd.classList.remove('open');
          };
        })(o.value);
        panel.appendChild(b);
      });
    }

    document.addEventListener('click', e => {
      const dd = document.getElementById('dd-school');
      if (dd && dd.classList.contains('open') && (!e.target.closest || !e.target.closest('#dd-school'))) {
        dd.classList.remove('open');
      }
    });

    /* Key requests now go through RPCs: cooldown + pending-block enforced
       server-side (submit_key_request), status via check_request_status. */

    function fmtWait(ms) {
      const h = Math.floor(ms / 3600000);
      const m = Math.ceil((ms % 3600000) / 60000);
      if (h > 0) return h + 'h ' + m + 'm';
      return Math.max(1, m) + 'm';
    }

    async function submitRequest() {
      const name = document.getElementById('reqName').value.trim();
      const reason = document.getElementById('reqMsg').value.trim();
      const school = document.getElementById('reqSchool').value;
      const errBox = document.getElementById('reqError');
      const btn = document.getElementById('reqBtn');
      errBox.textContent = '';
      if (!name) { errBox.textContent = 'Enter your name.'; authShake(); return; }
      if (!school) { errBox.textContent = 'Select your school.'; authShake(); return; }
      btn.disabled = true;
      btn.textContent = 'Sending…';
      try {
        const { data: res, error: rpcErr } = await sb.rpc('submit_key_request', {
          input_name: name, input_reason: reason, input_school: school
        });
        if (rpcErr) throw rpcErr;
        if (!res || !res.success) {
          const code = (res && res.error) || 'failed';
          if (code === 'pending') {
            errBox.textContent = 'You already have a pending request — check its status below.';
          } else if (code === 'cooldown') {
            const waitMs = ((res && res.retry_after) || 0) * 1000;
            errBox.textContent = 'You can request again in ' + fmtWait(waitMs) + '.';
          } else {
            errBox.textContent = 'Could not send request. Try again later.';
          }
          return;
        }
        try { localStorage.setItem('pending_request_name', name); } catch (e) {}
        document.getElementById('reqName').value = '';
        document.getElementById('reqMsg').value = '';
        document.getElementById('charCount').textContent = '0/500';
        document.getElementById('reqSchool').value = '';
        syncSchoolDD();
        showRequestStatus();
        toast('Request sent', 'ok');
        checkRequestStatus();
        subscribeRequestStatus(); // live approved/denied updates, no refresh needed
      } catch (e) {
        console.error(e);
        errBox.textContent = 'Could not send request. Try again later.';
        toast('Request failed', 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Request';
      }
    }

    /* ---------- key request status (realtime, shown to requester) ---------- */

    async function checkRequestStatus() {
      const wrap = document.getElementById('reqStatusWrap');
      if (!wrap) return;
      let name = null;
      try { name = localStorage.getItem('pending_request_name'); } catch (e) {}
      if (!name) { setHTMLifChanged(wrap, ''); return; }
      // A dismissed denial stays dismissed.
      let dismissed = null;
      try { dismissed = localStorage.getItem('request_dismissed_' + name); } catch (e) {}
      try {
        const { data, error } = await sb.rpc('check_request_status', { input_name: name });
        if (error) throw error;
        if (!data || !data.found) { setHTMLifChanged(wrap, ''); return; }
        let html = '';
        if (data.status === 'pending') {
          html = '<div class="req-banner muted-note">Your request is pending review…</div>';
        } else if (data.status === 'denied') {
          if (dismissed) { setHTMLifChanged(wrap, ''); return; }
          html = '<div class="req-banner denied"><strong>Your key request was denied.</strong>' +
            '<div style="margin-top:10px"><button class="mini-btn ghost" onclick="dismissRequestBanner()">Dismiss</button></div></div>';
        } else if (data.status === 'approved') {
          const keyText = (data.key) || '';
          approvedKey = keyText;
          if (keyText) {
            html = '<div class="req-banner approved"><strong>Your request was approved!</strong>' +
              '<div style="margin-top:10px"><button class="mini-btn" onclick="openApprovedModal()">View key</button></div></div>';
            if (!approvedShown) {
              approvedShown = true;
              openApprovedModal();
            }
          } else {
            // Approved but no key row: the key was deleted (or never created).
            // Never show "being prepared" here — say so and offer a fresh request.
            html = '<div class="req-banner denied"><strong>Your key was removed by staff.</strong>' +
              '<div class="muted-note" style="margin-top:8px">That approval no longer has a key attached.</div>' +
              '<div style="margin-top:10px"><button class="mini-btn" onclick="resetRequestState()">Request a new key</button></div></div>';
          }
        } else {
          html = '';
        }
        setHTMLifChanged(wrap, html);
      } catch (e) {
        console.error('request status failed:', e);
        if (wrap && !wrap.innerHTML) {
          wrap.innerHTML = '<div class="req-banner muted-note">Could not check status — check your connection. <button class="mini-btn ghost" onclick="checkRequestStatus()">Retry</button></div>';
        }
      }
    }

    function dismissRequestBanner() {
      try {
        const name = localStorage.getItem('pending_request_name');
        if (name) localStorage.setItem('request_dismissed_' + name, '1');
      } catch (e) {}
      const wrap = document.getElementById('reqStatusWrap');
      if (wrap) setHTMLifChanged(wrap, '');
    }

    function copyApprovedKey() {
      const el = document.getElementById('approvedKeyText');
      if (!el) return;
      const text = el.textContent;
      const done = () => toast('Copied!', 'ok');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => toast('Copy failed', 'err'));
      } else {
        toast('Copy not supported', 'err');
      }
    }

    // Approved popup — mirrors the request-form modal behavior.
    let approvedKey = '';
    let approvedShown = false;

    function openApprovedModal() {
      const keyEl = document.getElementById('approvedKeyText');
      if (keyEl) keyEl.textContent = approvedKey || '';
      const overlay = document.getElementById('approvedOverlay');
      if (!overlay) return;
      overlay.style.display = 'flex';
      requestAnimationFrame(() => {
        overlay.classList.add('show');
        requestAnimationFrame(() => overlay.classList.add('visible'));
      });
    }

    function closeApprovedModal() {
      const overlay = document.getElementById('approvedOverlay');
      if (!overlay) return;
      overlay.classList.remove('visible');
      setTimeout(() => {
        overlay.classList.remove('show');
        overlay.style.display = 'none';
      }, 250);
    }

    let reqChannel = null;
    let reqSubName = null;
    let reqPoll = null;

    function subscribeRequestStatus() {
      try {
        let name = null;
        try { name = localStorage.getItem('pending_request_name'); } catch (e) {}
        if (!name || name === reqSubName) return;
        if (reqChannel) { try { sb.removeChannel(reqChannel); } catch (e) {} reqChannel = null; }
        reqSubName = name;
        reqChannel = sb.channel('ls-req-' + name)
          .on('postgres_changes',
            { event: '*', schema: 'public', table: 'key_requests', filter: 'name=eq.' + name },
            () => checkRequestStatus())
          .subscribe();
        // 3s heartbeat as well — banner flips pending → approved → denied
        // with no user action even if realtime drops an event.
        if (reqPoll) clearInterval(reqPoll);
        reqPoll = setInterval(() => {
          try {
            let n = null;
            try { n = localStorage.getItem('pending_request_name'); } catch (e) {}
            if (n) checkRequestStatus();
          } catch (e) { console.error(e); }
        }, 3000);
      } catch (e) {
        console.error('request status realtime failed:', e);
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        const sdd = document.getElementById('dd-school');
        if (sdd) sdd.classList.remove('open');
        const approved = document.getElementById('approvedOverlay');
        if (approved && approved.classList.contains('visible')) closeApprovedModal();
      }
    });

    window.addEventListener('pagehide', () => {
      try { sb.getChannels().forEach(ch => { try { sb.removeChannel(ch); } catch (e) {} }); } catch (e) {}
    });

    /* Missed scheduled announcements: users who were offline when the
       5-minute alert fired catch up here on the login screen, exactly once
       each (tracked in announcement_alerts). Auto-redirect waits until the
       queue is acknowledged. */
    async function checkMissedAlerts() {
      let me = null;
      try { me = localStorage.getItem(LS_USER); } catch (e) {}
      if (!me) return;
      try {
        const now = Date.now();
        const r = await sb.from('announcements')
          .select('id, content, posted_by, scheduled_for')
          .not('scheduled_for', 'is', null)
          .lte('scheduled_for', new Date(now + 300000).toISOString())
          .order('scheduled_for', { ascending: true })
          .limit(10);
        if (r.error || !r.data || !r.data.length) return;
        const due = r.data.filter(a => {
          const t = new Date(a.scheduled_for).getTime();
          return !isNaN(t) && now >= t - 300000;
        });
        if (!due.length) return;
        const seenIds = [];
        for (const a of due) {
          try {
            const s = await sb.rpc('alerts_check', { input_username: me, input_token: '', announcement_id: a.id });
            if (!s.error && s.data && s.data.seen) seenIds.push(a.id);
          } catch (e) {}
        }
        const missed = due.filter(a => seenIds.indexOf(a.id) === -1);
        if (!missed.length) return;
        await showMissedAlertQueue(me, missed);
      } catch (e) { console.error('missed alerts failed:', e); }
    }

    function showMissedAlertQueue(me, items) {
      return new Promise(resolve => {
        let i = 0;
        const m = document.getElementById('missedAlertModal');
        const body = document.getElementById('missedAlertBody');
        const when = document.getElementById('missedAlertWhen');
        const btn = document.getElementById('missedAlertBtn');
        function render() {
          const a = items[i];
          body.textContent = a.content || '';
          let label = '';
          try { label = new Date(a.scheduled_for).toLocaleString(); } catch (e) {}
          when.textContent = '⏰ ' + label + (a.posted_by ? ' — ' + a.posted_by : '');
          btn.textContent = (i === items.length - 1) ? 'Continue' : 'Got it (' + (i + 1) + '/' + items.length + ')';
        }
        btn.onclick = async () => {
          const a = items[i];
          try { await sb.rpc('alerts_add', { input_username: me, input_token: '', announcement_id: a.id }); } catch (e) {}
          i++;
          if (i >= items.length) {
            m.classList.remove('visible');
            resolve();
          } else render();
        };
        render();
        m.classList.add('visible');
      });
    }

    // Missed scheduled alerts first (returners catch up), then auto-redirect.
    (async () => { try { await checkMissedAlerts(); } catch (e) {} checkExistingSession(); })();
    checkRequestStatus();
    subscribeRequestStatus();
    syncSchoolDD();
    try {
      if (localStorage.getItem('pending_request_name')) {
        switchAuthTab('request');
        showRequestStatus();
      }
    } catch (e) {}
  </script>

</body>
