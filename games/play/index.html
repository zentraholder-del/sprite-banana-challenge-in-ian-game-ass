<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightspeed — Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #080810;
      min-height: 100vh;
      color: #fff;
    }

    /* Background blobs */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.2;
    }
    .blob1 { width: 560px; height: 560px; background: #7c3aed; top: -170px; left: -170px; }
    .blob2 { width: 460px; height: 460px; background: #2563eb; bottom: -120px; right: -120px; }

    /* NAV */
    nav {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(10,10,22,0.55);
      backdrop-filter: blur(28px) saturate(1.5);
      -webkit-backdrop-filter: blur(28px) saturate(1.5);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 8px 32px rgba(0,0,0,0.35);
    }

    .nav-logo {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-user {
      font-size: 13px;
      color: #9ca3af;
    }

    .nav-user strong {
      color: #c4b5fd;
      font-weight: 600;
    }

    .logout-btn {
      background: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 7px 14px;
      font-size: 13px;
      color: #9ca3af;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 2px 8px rgba(0,0,0,0.35);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .logout-btn:hover {
      background: linear-gradient(165deg, rgba(255,255,255,0.14), rgba(124,58,237,0.12));
      color: #fff;
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 16px rgba(0,0,0,0.4);
    }

    /* MAIN */
    .main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .page-header p {
      font-size: 13px;
      color: #6b6b8a;
      margin-top: 4px;
    }
    .online-line { display: flex; align-items: center; font-size: 12px; color: #6b6b8a; margin-top: 8px; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-right: 8px; }
    .reqadmin-note { font-size: 12px; color: #6b6b8a; }
    /* moderation + leaderboard */
    #banBanner { margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
    .ban-card {
      background: #13131a; border: 1px solid #1e1e2e; border-left: 4px solid #ef4444;
      border-radius: 16px; padding: 14px 16px; font-size: 13px; color: #e2e2f0; line-height: 1.5;
      animation: pageIn 0.2s ease-out;
    }
    .staff-bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 14px; font-size: 12px; color: #6b6b8a;
    }
    .staff-pill {
      display: inline-flex; align-items: center; gap: 6px;
      background: #13131a; border: 1px solid #1e1e2e; border-radius: 20px;
      padding: 6px 12px; font-size: 12px; color: #e2e2f0;
    }
    .staff-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
    .leader-card {
      background: #13131a; border: 1px solid #1e1e2e; border-radius: 16px;
      padding: 16px; margin-bottom: 18px;
    }
    .leader-card h3 { font-size: 14px; font-weight: 700; color: #e2e2f0; margin-bottom: 10px; }
    .leader-row {
      display: flex; align-items: center; gap: 10px; padding: 7px 0;
      border-bottom: 1px solid #1e1e2e; font-size: 13px; color: #e2e2f0;
    }
    .leader-row:last-child { border-bottom: none; }
    .leader-rank { font-weight: 800; color: #7c3aed; min-width: 28px; }
    .leader-time { margin-left: auto; color: #6b6b8a; font-variant-numeric: tabular-nums; }
    .fav-btn {
      background: #1a1a24; border: 1.5px solid #2a2a3d; border-radius: 10px; color: #6b6b8a;
      font-size: 13px; padding: 8px 14px; cursor: pointer; min-height: 44px;
      transition: border-color 0.2s cubic-bezier(0.22,1,0.36,1), color 0.2s cubic-bezier(0.22,1,0.36,1);
      touch-action: manipulation;
    }
    .fav-btn.active { border-color: #7c3aed; color: #7c3aed; }
    .game-card .fav-star {
      position: absolute; top: 10px; right: 10px; width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,10,15,0.7); border: 1px solid #2a2a3d; border-radius: 10px;
      color: #6b6b8a; font-size: 18px; cursor: pointer;
    }
    .game-card .fav-star.on { color: #f59e0b; border-color: #f59e0b; }
    .game-card { position: relative; }
    .result-count { font-size: 12px; color: #6b6b8a; margin: 12px 0; }
    .flag-btn {
      background: none; border: none; color: #6b6b8a; font-size: 12px; cursor: pointer;
      min-width: 44px; min-height: 44px; margin-left: 2px;
    }
    .flag-btn:hover { color: #ef4444; }

    .search-wrap {
      margin-top: 16px;
    }

    .search-wrap input {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(165deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      background-color: rgba(10,10,22,0.5);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      color: #fff;
      outline: none;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.3);
      transition: border-color 0.3s cubic-bezier(0.22, 1.15, 0.36, 1), box-shadow 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }

    .search-wrap input::placeholder { color: #4b5563; }
    .search-wrap input:focus {
      border-color: rgba(124,58,237,0.65);
      box-shadow: 0 0 0 4px rgba(124,58,237,0.16), inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 20px rgba(124,58,237,0.2);
    }

    /* GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    /* GAME CARD */
    .game-card {
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 45%, rgba(124,58,237,0.06));
      background-color: rgba(14,14,26,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 32px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(255,255,255,0.03);
      transition: all 0.32s cubic-bezier(0.22, 1.15, 0.36, 1);
      animation: cardIn 0.35s cubic-bezier(0.22, 1.15, 0.36, 1) backwards;
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: rgba(139,92,246,0.5);
      background: linear-gradient(165deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03) 45%, rgba(124,58,237,0.14));
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 18px 48px rgba(0,0,0,0.5), 0 8px 32px rgba(124,58,237,0.25),
        inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.05);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .game-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1e1b4b, #1e3a5f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -12px 24px rgba(0,0,0,0.25);
    }

    .game-info {
      padding: 14px 16px;
    }

    .game-info h3 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .game-info p {
      font-size: 12px;
      color: #4b5563;
      line-height: 1.5;
    }

    .game-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      background: linear-gradient(165deg, rgba(124,58,237,0.22), rgba(124,58,237,0.1));
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 20px;
      font-size: 11px;
      color: #a78bfa;
      font-weight: 500;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 11px;
      color: #1f2937;
      padding: 40px 0 20px;
      letter-spacing: 0.5px;
    }

    /* CHAT WIDGET */
    .chat-fab {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 50;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 12px 32px rgba(124,58,237,0.5);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .chat-fab:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 4px rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 16px 40px rgba(124,58,237,0.6);
    }
    .chat-fab:active { transform: scale(0.96); }

    .chat-panel {
      position: fixed;
      right: 22px;
      bottom: 86px;
      z-index: 50;
      width: 320px;
      max-height: 440px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 45%, rgba(124,58,237,0.06));
      background-color: rgba(17,17,24,0.6);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 48px rgba(0,0,0,0.55), 0 32px 96px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -1px 0 rgba(255,255,255,0.04);
    }
    .chat-panel.open {
      display: flex;
      animation: panelIn 0.32s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-head {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-head small {
      font-weight: 400;
      color: #4b5563;
      font-size: 11px;
    }

    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
      max-height: 300px;
    }

    .chat-msg { font-size: 12.5px; line-height: 1.45; }
    .chat-msg .meta {
      font-size: 10.5px;
      color: #6b7280;
      margin-bottom: 2px;
    }
    .chat-msg .meta strong { color: #a78bfa; font-weight: 600; }
    .chat-msg.admin .meta strong { color: #f472b6; }
    .chat-msg .bubble {
      display: inline-block;
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 7px 10px;
      color: #e5e7eb;
      word-break: break-word;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .chat-empty {
      text-align: center;
      font-size: 12px;
      color: #4b5563;
      padding: 24px 0;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .chat-form input {
      flex: 1;
      background: linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      background-color: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 13px;
      color: #fff;
      outline: none;
      transition: border-color 0.3s cubic-bezier(0.22, 1.15, 0.36, 1), box-shadow 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .chat-form input:focus {
      border-color: rgba(124,58,237,0.65);
      box-shadow: 0 0 0 4px rgba(124,58,237,0.16), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .chat-form button {
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 0 14px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 2px 6px rgba(0,0,0,0.4), 0 6px 20px rgba(124,58,237,0.4);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .chat-form button:hover {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      transform: translateY(-1px);
    }
    .chat-form button:active { transform: scale(0.97); }

    /* ADMIN FAB (visible to admins only) */
    .admin-fab {
      position: fixed;
      top: 76px;
      right: 22px;
      z-index: 50;
      display: none;
      padding: 8px 14px;
      border-radius: 22px;
      background: linear-gradient(165deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
      background-color: rgba(17,17,24,0.6);
      border: 1px solid rgba(124,58,237,0.45);
      backdrop-filter: blur(28px) saturate(1.5);
      -webkit-backdrop-filter: blur(28px) saturate(1.5);
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 2px 6px rgba(0,0,0,0.4), 0 10px 28px rgba(0,0,0,0.45);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .admin-fab:hover {
      border-color: rgba(139,92,246,0.8);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 2px 6px rgba(0,0,0,0.4), 0 12px 32px rgba(124,58,237,0.4);
    }
    .admin-fab.show { display: inline-block; }

    /* DM WIDGET (bottom-left, separate from global chat) */
    .dm-fab {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 50;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 12px 32px rgba(124,58,237,0.5);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .dm-fab:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 4px rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 16px 40px rgba(124,58,237,0.6);
    }
    .dm-fab:active { transform: scale(0.96); }
    .dm-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f472b6;
      border: 2px solid #080810;
      display: none;
    }
    .dm-dot.show { display: block; }

    .dm-panel {
      position: fixed;
      left: 22px;
      bottom: 86px;
      z-index: 50;
      width: 320px;
      max-height: 440px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 45%, rgba(244,114,182,0.06));
      background-color: rgba(17,17,24,0.6);
      border: 1px solid rgba(244,114,182,0.3);
      border-radius: 22px;
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 48px rgba(0,0,0,0.55), 0 32px 96px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -1px 0 rgba(255,255,255,0.04);
    }
    .dm-panel.open {
      display: flex;
      animation: panelIn 0.32s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .dm-note {
      padding: 8px 14px;
      font-size: 11px;
      color: #6b7280;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    /* TROLL LAYER (transient admin effects, all self-clearing) */
    #trollLayer {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      overflow: hidden;
    }
    /* In-modal mode: the layer is reparented inside the game frame wrap
       so every effect renders above the game iframe, including when the
       modal wrapper itself is fullscreened. */
    #trollLayer.in-modal {
      position: absolute;
      z-index: 30;
    }
    /* GAME MODAL (games play in-page; hub listeners keep running) */
    #gameModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 150;
      background: rgba(10,10,15,0.9);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #gameModal.open { display: flex; }
    #gameModal:fullscreen { padding: 0; background: #0a0a0f; }
    .game-modal-card {
      background: #13131a;
      border: 1px solid #1e1e2e;
      border-radius: 16px;
      width: min(1100px, 100%);
      height: min(780px, 94vh);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalUp 0.2s cubic-bezier(0.22,1,0.36,1);
    }
    #gameModal:fullscreen .game-modal-card {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0;
    }
    .game-modal-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 16px;
      border-bottom: 1px solid #1e1e2e;
      font-size: 14px;
      font-weight: 600;
      color: #e2e2f0;
    }
    .game-modal-head span {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .gm-btn {
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1a1a24;
      border: 1.5px solid #2a2a3d;
      border-radius: 10px;
      color: #e2e2f0;
      font-size: 17px;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.2s cubic-bezier(0.22,1,0.36,1), transform 0.2s cubic-bezier(0.22,1,0.36,1);
    }
    .gm-btn:hover { background: #7c3aed; }

    // Validate the stored session token against Supabase.

    async function checkAuth() {
      const token = localStorage.getItem(LS_TOKEN);
      if (!token) {
        window.location.href = '../index.html';
        return null;

      try {
        const { data, error } = await sb
          .from('license_keys')
          .select('id, is_active, is_admin, rank, username, used_by')
          .eq('session_token', token)
          .maybeSingle();
        if (error) throw error;
        if (!data || !data.is_active) {
          logout();
          return null;
        }
        const name = localStorage.getItem(LS_USER) || data.used_by || data.username || 'player';
        const rank = data.rank || (data.is_admin ? 'admin' : 'user');
        try { localStorage.setItem(LS_RANK, rank); } catch (e) {}

    async function sendChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const status = document.getElementById('chatStatus');
      const content = input.value.trim();
      if (!content) return false;
      const username = (localStorage.getItem(LS_USER) || 'anon').slice(0, 32);
      try {
        // Re-check blacklist on every send — a login-time check can go
        // stale if the user is blacklisted mid-session. If this select
        // fails on a transient network error we still attempt the insert
        // below, which restores the input on failure.
        const { data: banned, error: banErr } = await sb
          .from('blacklist')
          .select('id')
          .eq('username', username)
          .limit(1);
        if (!banErr && banned && banned.length > 0) {
          status.textContent = 'blocked';
          return false;
        }
      } catch (err) {
        console.error(err);
      }
      // Mute + slowmode gates (refreshed every 3s by the session poller).
      if (myMuteUntil && Date.now() < myMuteUntil) {
        status.textContent = 'muted';
        toast('You are muted until ' + new Date(myMuteUntil).toLocaleString(), 'err');
        return false;
      }
      if (slowmodeSecs > 0 && Date.now() - lastChatSent < slowmodeSecs * 1000) {
        const waitS = Math.ceil(slowmodeSecs - (Date.now() - lastChatSent) / 1000);
        toast('Slow mode: wait ' + waitS + 's', 'err');
        return false;
      }
      input.value = '';
      const sendBtn = document.querySelector('.chat-form button[type="submit"]');
      if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '…'; }
      try {
        const payload = { username, content: content.slice(0, 500), rank: myRank() };
        if (replyTo && replyTo.id) {
          payload.reply_to = replyTo.id;
          payload.reply_preview = replyTo.preview;
          payload.reply_username = replyTo.username;
        }
        let { error } = await sb
          .from('messages')
          .insert(payload);
        if (error && (payload.rank !== undefined || payload.reply_username !== undefined)) {
          // Older schema without the new columns — retry with base fields.
          const slim = { username: payload.username, content: payload.content };
          if (payload.reply_to !== undefined) {
            slim.reply_to = payload.reply_to;
            slim.reply_preview = payload.reply_preview;
          }
          const r2 = await sb.from('messages').insert(slim);
          error = r2.error;
        }
        if (error) throw error;
        cancelReply();
        lastChatSent = Date.now();
        if (status.textContent === 'blocked') status.textContent = 'live';
      } catch (err) {
        console.error(err);
        input.value = content; // restore so the user doesn't lose it
        toast('Send failed', 'err');
      } finally {
        if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = 'Send'; }
      }
      return false;
    }

    // iOS Safari blocks audio until a user gesture. Unlock on first tap
    // (touchend for iPad, pointerdown for everything else). Visuals never
    // depend on sound succeeding.
    function registerTrollUnlock() {
      const unlock = () => {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            if (!trollAudioCtx) trollAudioCtx = new AC();
            if (trollAudioCtx.state === 'suspended') trollAudioCtx.resume();

          const el = document.getElementById('trollAudio');
          if (el) {

            if (p && p.catch) p.catch(() => {});

      window.addEventListener('pointerdown', unlock, { once: true });

    // Short synthesized scare burst (no audio file needed). Best effort.
    function scareSound() {
      try {
        if (!trollAudioCtx || trollAudioCtx.state !== 'running') return;
        const ctx = trollAudioCtx;
        const t = ctx.currentTime;
        [110, 116.5, 123.5].forEach((f, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.25, t + 0.05 + i * 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
          o.connect(g).connect(ctx.destination);
          o.start(t);
          o.stop(t + 1.5);
        });
      } catch (e) { /* silent — visual still plays */ }
    }

    // Persistent tricks stay running until an "off" event for the same
    // trick + scope arrives (scope = global '*' or one specific user).
    // Instant tricks (confetti, popups, alert) always fire once.
    const PERSISTENT_TRICKS = ['jumpscare', 'shake', 'disconnect', 'flip', 'ripples', 'invert', 'loading'];
    const activeTricks = {}; // "type|scope" -> { stop }

    function stopTrick(key) {
      const t = activeTricks[key];
      if (!t) return;
      delete activeTricks[key];
      try { t.stop(); } catch (e) { console.error('trick stop failed:', e); }
    }

    // Maps a persistent type to its named stop function. Only the
    // state:'off' dispatch path (via stopTrick) ever invokes these.
    function startPersistent(type, payload) {
      switch (type) {
        case 'jumpscare': startJumpscare(jumpscareSrc(payload || {})); return stopJumpscare;
        case 'shake': startShake(); return stopShake;
        case 'disconnect': startDisconnect(); return stopDisconnect;
        case 'flip': startFlip(); return stopFlip;
        case 'ripples': startRipples(); return stopRipples;
        case 'invert': startInvert(); return stopInvert;
        case 'loading': startLoading(); return stopLoading;
        default: return null;

    function dispatchTroll(row, fromInit) {
      let me = 'anon';
      try { me = (localStorage.getItem(LS_USER) || myName || 'anon').slice(0, 32); } catch (e) {}
      if (row.target_username && row.target_username !== me) return; // not for me: ignore entirely
      if (row.id !== undefined && row.id !== null) seenTrollIds.add(row.id);
      const scope = row.target_username || '*';
      const key = row.event_type + '|' + scope;
      const state = row.payload && row.payload.state;
      if (PERSISTENT_TRICKS.indexOf(row.event_type) !== -1) {
        if (state === 'off') {
          console.log('[troll] off received for', key);
          stopTrick(key);
          return;
        }
        if (activeTricks[key]) {
          // Already running — do NOTHING. Never restart a live effect,
          // or polls/duplicate rows would cause visible flicker.
          console.log('[troll] already running, ignoring on for', key);
          return;
        }
        console.log('[troll] on received for', key);
        const stop = startPersistent(row.event_type, row.payload || {});
        if (!stop) return;
        activeTricks[key] = { stop: stop };
        // Runs forever until an "off" event (or page reload). No timers.
        return;
      }
      const payload = row.payload || {};
      switch (row.event_type) {
        case 'confetti': effectConfetti(); break;
        case 'popups': effectPopups(payload); break;
        case 'alert': effectAlert(payload); break;
        default: console.error('unknown trick:', row.event_type);
      }
    }

    // Initial sync: seed seenTrollIds with ALL historical ids first,
    // then start effects where the latest row per event_type|scope is on.
    // Out-of-scope rows are ignored entirely (never added, never run).
    async function initTrollState() {
      let me = 'anon';
      try { me = (localStorage.getItem(LS_USER) || myName || 'anon').slice(0, 32); } catch (e) {}
      try {
        const { data, error } = await sb
          .from('troll_events')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) throw error;
        const latest = {};
        for (const row of (data || [])) {
          if (row.target_username && row.target_username !== me) continue;
          seenTrollIds.add(row.id);
          const key = row.event_type + '|' + (row.target_username != null ? row.target_username : '*');
          if (!latest[key]) latest[key] = row;
        }
        for (const row of Object.values(latest)) {
          if (row.payload && row.payload.state === 'on') {
            try { dispatchTroll(row, true); } catch (e) { console.error('resume trick failed:', e); }
          }
        }
        trollReady = true;
      } catch (e) {
        console.error('init troll state failed:', e);
        trollReady = true; // let the poll take over converging persistent state
      }
    }

    // Single module-level set of processed troll event ids. Seeded with
    // ALL historical ids on load, added to as new rows arrive. Never
    // reset, never cleared. Out-of-scope rows are ignored entirely and
    // never added.
    const seenTrollIds = new Set();
    // False until initTrollState finishes seeding. The poll refuses to run
    // before that, so it can never replay history on a fresh load.
    let trollReady = false;

    let trollChannel = null;
    function subscribeTrolls() {
      try {
        if (trollChannel) { try { sb.removeChannel(trollChannel); } catch (e) {} }
        trollChannel = sb.channel('ls-trolls')
          .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'troll_events' },
            payload => {
              try { dispatchTroll(payload.new); }
              catch (e) { console.error('trick failed:', e); }
            })
          .subscribe();
      } catch (e) {
        console.error('troll realtime subscribe failed:', e);
      }
    }

    // Re-subscribe when the tab becomes visible again (mobile browsers
    // and flaky networks can silently drop realtime channels).
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        try { subscribeTrolls(); } catch (e) { console.error('troll resubscribe failed:', e); }
      }
    });

    // 3s fallback poll — catches events realtime missed. Only unseen ids
    // dispatch, so running effects are never restarted by the poll.
    async function pollTrolls() {
      if (!trollReady) return; // init hasn't seeded history yet — fire nothing
      let me = 'anon';
      try { me = (localStorage.getItem(LS_USER) || myName || 'anon').slice(0, 32); } catch (e) {}
      try {
        const { data, error } = await sb
          .from('troll_events')
          .select('id, event_type, target_username, payload, created_at')
          .order('id', { ascending: false })
          .limit(20);
        if (error) throw error;
        (data || []).slice().reverse().forEach(r => {
          if (r.target_username && r.target_username !== me) return; // not mine: ignore entirely
          if (seenTrollIds.has(r.id)) return; // already processed: do NOTHING
          seenTrollIds.add(r.id);
          // Instant one-shots are realtime-only: a stale confetti/popup/alert
          // must never re-fire from a poll. Only persistent on/off syncs here.
          if (PERSISTENT_TRICKS.indexOf(r.event_type) === -1) return;
          try { dispatchTroll(r); } catch (e) { console.error('trick failed:', e); }
        });
      } catch (e) {
        console.error('troll poll failed:', e);
      }
    }

    /* ---------- Announcements (pinned banner, separate from chat) ---------- */

    let announceSeenMax = 0;
    let announceHidden = false;

    function dismissAnnouncements() {
      announceHidden = true;
      const bar = document.getElementById('announceBar');
      if (bar) bar.style.display = 'none';

    async function loadAnnouncements() {
      const bar = document.getElementById('announceBar');
      if (!bar) return;
      try {
        const { data, error } = await sb
          .from('announcements')
          .select('id, content, posted_by, rank, created_at')
          .order('created_at', { ascending: false })
          .limit(3);
        if (error) throw error;
        const rows = data || [];
        if (rows.length === 0) { bar.style.display = 'none'; return; }
        const maxId = Math.max.apply(null, rows.map(r => r.id));
        if (announceHidden && maxId <= announceSeenMax) return; // stays dismissed
        announceHidden = false;
        announceSeenMax = Math.max(announceSeenMax, maxId);
        bar.innerHTML = '';
        rows.forEach(a => {
          const card = document.createElement('div');
          card.className = 'announce';
          const head = document.createElement('div');
          head.className = 'ahead';
          const who = document.createElement('strong');
          who.textContent = '📢 ' + (a.posted_by || 'admin');
          head.appendChild(who);
          const badge = document.createElement('span');
          badge.innerHTML = rankBadgeHtml(a.rank);
          head.appendChild(badge);
          const when = document.createElement('span');
          when.textContent = a.created_at ? formatTime(a.created_at) : '';
          head.appendChild(when);
          const x = document.createElement('button');
          x.textContent = '✕';
          x.setAttribute('aria-label', 'Dismiss announcements');
          x.onclick = dismissAnnouncements;
          head.appendChild(x);
          const body = document.createElement('div');
          body.textContent = a.content || '';
          card.appendChild(head);
          card.appendChild(body);
          bar.appendChild(card);
        });
        bar.style.display = 'flex';
      } catch (e) {
        console.error('announcements failed:', e);
      }
    }

    function subscribeAnnouncements() {
      try {
        sb.channel('ls-announce')
          .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'announcements' },
            () => { try { loadAnnouncements(); } catch (e) { console.error(e); } })
          .subscribe();
      } catch (e) {
        console.error('announce realtime subscribe failed:', e);
      }
    }

    /* ---------- Heartbeat pollers (realtime + 3s fallback) ---------- */

    const pollers = {};
    function startPoller(name, fn, ms) {
      stopPoller(name);
      try { fn(); } catch (e) { console.error('poller ' + name + ' failed:', e); }
      pollers[name] = setInterval(fn, ms);
    }
    function stopPoller(name) {
      if (pollers[name]) { clearInterval(pollers[name]); delete pollers[name]; }
    }

    async function loadOnlineCount() {

    // Staff online strip + daily playtime leaderboard (quiet on failure).
    async function loadStaffAndBoard() {
      const cutoff = new Date(Date.now() - 90000).toISOString();
      try {
        const [act, staff] = await Promise.all([
          sb.from('active_sessions').select('username').gte('last_seen', cutoff).limit(100),
          sb.from('license_keys').select('used_by, rank').in('rank', ['owner', 'admin', 'mod']).limit(100)
        ]);

    function renderStaffBar(sessions, staffKeys) {
      const bar = document.getElementById('staffBar');

        pill.appendChild(nm);
        pill.appendChild(badge);

    function fmtPlay(secs) {
      secs = Math.max(0, parseInt(secs, 10) || 0);
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      if (h > 0) return h + 'h ' + m + 'm';
      if (m > 0) return m + 'm';
      return secs + 's';
    }

    function renderLeaderboard(rows) {
      const box = document.getElementById('leaderList');
      if (!box) return;
      box.innerHTML = '';

        box.innerHTML = '<div style="font-size:13px;color:#6b6b8a">No playtime yet today — be the first!</div>';

        rk.className = 'leader-rank';
        rk.textContent = medals[i] || ((i + 1) + '.');

        tm.className = 'leader-time';

    /* ---------- Request admin access (once per account, ever) ---------- */

    let adminReqState = 'unknown'; // null | pending | approved | denied | unsupported
    let myGameBan = null; // { expires_at, reason } while banned from games (session stays alive)
    let myMuteUntil = 0; // timestamp ms while chat-muted
    let slowmodeSecs = 0; // chat slowmode from chat_settings
    let lastChatSent = 0; // client-side slowmode clock

    async function loadAdminRequestState() {
      const wrap = document.getElementById('adminReqWrap');
      if (!wrap) return;
      if (myRank() !== 'user') { wrap.innerHTML = ''; return; }
      let token = null;
      try { token = localStorage.getItem(LS_TOKEN); } catch (e) {}
      if (!token) { wrap.innerHTML = ''; return; }
      try {
        const { data, error } = await sb
          .from('license_keys')
          .select('admin_request_status')
          .eq('session_token', token)
          .maybeSingle();
        if (error) throw error;
        const st = (data && data.admin_request_status) || null;
        adminReqState = st;
        wrap.innerHTML = '';
        if (st) {
          const note = document.createElement('span');
          note.className = 'reqadmin-note';
          note.textContent = "You've already used your one admin request.";
          wrap.appendChild(note);
        } else {

          b.className = 'logout-btn';
          b.textContent = 'Request Admin Access';
          b.onclick = requestAdmin;
          wrap.appendChild(b);

      } catch (e) {
        console.error('admin request state failed:', e);
        if (/column/i.test((e && e.message) || '')) adminReqState = 'unsupported';
      }

    async function requestAdmin() {
      if (myRank() !== 'user') return;
      if (!confirm('Request admin access? You can only do this once, ever.')) return;
      let token = null;
      try { token = localStorage.getItem(LS_TOKEN); } catch (e) {}
      if (!token) { toast('No session. Log in again.', 'err'); return; }
      try {
        // Server-side once-ever guard: the update only touches rows whose
        // status is still NULL, so a repeat click affects 0 rows.
        const { data, error } = await sb
          .from('license_keys')
          .update({ admin_request_status: 'pending' })
          .eq('session_token', token)
          .is('admin_request_status', null)
          .select('id');
        if (error) throw error;
        if (!data || data.length === 0) {
          toast("You've already used your one admin request.", 'err');
          loadAdminRequestState();
          return;
        }
        toast('Admin request sent for review', 'ok');
        loadAdminRequestState();
      } catch (e) {
        console.error('request admin failed:', e);
        toast('Request failed. Try again.', 'err');
      }

    /* ---------- Session refresh (rank changes apply live, no relogin) ---------- */

    function updateSessionNav(rank) {
      let name = 'player';
      try { name = localStorage.getItem(LS_USER) || 'player'; } catch (e) {}
      const nav = document.getElementById('navUser');
      if (nav) {
        nav.innerHTML = 'Signed in as <strong></strong>';

        const badge = document.createElement('span');
        badge.innerHTML = rankBadgeHtml(rank);
        nav.appendChild(badge);
      }
      const elevated = rank === 'owner' || rank === 'admin' || rank === 'mod';
      const fab = document.getElementById('adminFab');
      if (fab) fab.classList.toggle('show', elevated);
      loadAdminRequestState();
    }

    async function refreshSession() {
      let token = null;
      try { token = localStorage.getItem(LS_TOKEN); } catch (e) {}
      if (!token) return;
      try {
        let res = await sb
          .from('license_keys')
          .select('is_active, is_admin, rank, admin_request_status')
          .eq('session_token', token)
          .maybeSingle();
        if (res.error && /column/i.test(res.error.message || '')) {
          // admin_request_status column not migrated yet — rank polling
          // still works without it.
          res = await sb
            .from('license_keys')
            .select('is_active, is_admin, rank')
            .eq('session_token', token)
            .maybeSingle();
        }
        const { data, error } = res;
        if (error) throw error;
        if (!data || !data.is_active) { logout(); return; }
        const rank = data.rank || (data.is_admin ? 'admin' : 'user');
        let cur = 'user';
        try { cur = localStorage.getItem(LS_RANK) || 'user'; } catch (e) {}
        if (rank !== cur) {
          try { localStorage.setItem(LS_RANK, rank); } catch (e) {}
          updateSessionNav(rank);
          toast('Your rank is now ' + rank.toUpperCase(), 'ok');
        }
        const st = data.admin_request_status || null;
        if (adminReqState !== 'unsupported' && st !== adminReqState) loadAdminRequestState();
        refreshModeration();
      } catch (e) {
        console.error('session refresh failed:', e);
      }
    }

    // Mute / game-ban / slowmode state. Quiet on failure (pre-migration safe).
    async function refreshModeration() {
      let me = 'player';
      try { me = (localStorage.getItem(LS_USER) || 'player').slice(0, 32); } catch (e) {}
      try {
        const now = new Date().toISOString();
        const [ban, mute, slow] = await Promise.all([
          sb.from('game_bans').select('expires_at, reason').eq('username', me).gt('expires_at', now).order('expires_at', { ascending: false }).limit(1).maybeSingle(),
          sb.from('mutes').select('expires_at, reason').eq('username', me).gt('expires_at', now).order('expires_at', { ascending: false }).limit(1).maybeSingle(),
          sb.from('chat_settings').select('slowmode_seconds').eq('id', 1).maybeSingle()
        ]);
        myGameBan = (!ban.error && ban.data) ? ban.data : null;
        myMuteUntil = (!mute.error && mute.data && mute.data.expires_at) ? new Date(mute.data.expires_at).getTime() : 0;
        slowmodeSecs = (!slow.error && slow.data && slow.data.slowmode_seconds) ? slow.data.slowmode_seconds : 0;
        renderBanBanner();
      } catch (e) {
        console.error('moderation refresh failed:', e);

    function renderBanBanner() {
      const wrap = document.getElementById('banBanner');
      if (!wrap) return;

    // Live check used when opening a game (blocks even inside the 3s window).
    async function isGameBannedLive() {
      let me = 'player';
      try { me = (localStorage.getItem(LS_USER) || 'player').slice(0, 32); } catch (e) {}
      try {
        const { data, error } = await sb
          .from('game_bans')
          .select('expires_at, reason')
          .eq('username', me)
          .gt('expires_at', new Date().toISOString())
          .order('expires_at', { ascending: false })
          .limit(1)
          .maybeSingle();
        if (error) throw error;

    /* ---------- Presence (active_sessions) ---------- */

    let myName = 'anon';
    let heartbeatTimer = null;

    async function trackPresence(game) {
      try {
        const { error } = await sb
          .from('active_sessions')
          .upsert(
            { username: myName, current_game: game, last_seen: new Date().toISOString() },
            { onConflict: 'username' }
          );

      } catch (e) {
        console.error(e);

    function startHeartbeat() {
      // Refresh last_seen every 30s so admin can tell active vs stale.
      // Only the timestamp is rewritten; current_game is left as-is.
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        sb.from('active_sessions')
          .update({ last_seen: new Date().toISOString() })
          .eq('username', myName)
          .then(({ error }) => { if (error) console.error(error); });
        trackPlaytime();
      }, 30000);
    }

    // Adds ~30s to today's playtime total (drives the daily leaderboard).
    async function trackPlaytime() {
      try {
        const day = new Date().toISOString().slice(0, 10);
        const { data, error } = await sb
          .from('daily_playtime')
          .select('id, seconds')
          .eq('username', myName)
          .eq('day', day)
          .maybeSingle();
        if (error) throw error;
        if (data) {
          const { error: uerr } = await sb
            .from('daily_playtime')
            .update({ seconds: (data.seconds || 0) + 30 })
            .eq('id', data.id);
          if (uerr) throw uerr;
        } else {
          const { error: ierr } = await sb
            .from('daily_playtime')
            .insert({ username: myName, day: day, seconds: 30 });
          if (ierr) throw ierr;
        }
      } catch (e) {
        console.error('playtime failed:', e);
      }
    }

    /* ---------- Game modal (in-page player + fullscreen-safe overlay) ----------
       Games open in an iframe inside #gameModal so chat, announcements, the
       3s pollers and the troll receiver keep running. Fullscreen is requested
       on the modal wrapper (never the iframe) with the troll layer reparented
       inside it, so every effect renders above the game. */

    let gameModalOpen = false;
    let gameTicket = 0; // latest openGame wins; stale async opens abort

    // Mount point for class-based effects: the frame wrap while a game is
    // open (fullscreen-safe), otherwise the page body.
    function trollEffectTarget() {
      return gameModalOpen ? document.getElementById('gameFrameWrap') : document.body;
    }

    // Move running shake/flip/invert classes across the modal boundary so
    // an already-active effect stays visible immediately on open/close.
    function migrateEffectClasses(toWrap) {
      const wrap = document.getElementById('gameFrameWrap');
      if (!wrap) return;
      const from = toWrap ? document.body : wrap;
      const to = toWrap ? wrap : document.body;
      ['troll-shake', 'troll-flip', 'troll-invert'].forEach(c => {
        if (from.classList.contains(c)) { from.classList.remove(c); to.classList.add(c); }
      });
    }

    // Cards route through here so the open is recorded, then the game
    // opens in-page instead of navigating away from the hub.
    async function openGame(path, name) {
      const ticket = ++gameTicket;
      await trackPresence(name);
      if (ticket !== gameTicket) return; // superseded by a newer open
      if (await isGameBannedLive()) {
        toast('You are banned from playing right now.', 'err');
        return;
      }
      closeGame(); // teardown first: rapid switches never stack iframes
      document.getElementById('gameModalTitle').textContent = name;
      const wrap = document.getElementById('gameFrameWrap');
      const frame = document.createElement('iframe');
      frame.id = 'gameFrame';
      frame.title = name;
      frame.src = '../' + path + '/index.html';
      wrap.appendChild(frame);
      const layer = trollLayer();
      wrap.appendChild(layer);
      layer.classList.add('in-modal');
      migrateEffectClasses(true);
      gameModalOpen = true;
      const modal = document.getElementById('gameModal');
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      updateFsBtn();
    }

    function closeGame() {
      if (!gameModalOpen) return;
      gameTicket++; // invalidate any in-flight open racing this close
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          const p = document.exitFullscreen();
          if (p && p.catch) p.catch(() => {});
        }
      } catch (e) {}
      const frame = document.getElementById('gameFrame');
      if (frame) {
        try { frame.src = 'about:blank'; } catch (e) {}
        if (frame.parentNode) frame.parentNode.removeChild(frame);
      }
      const layer = document.getElementById('trollLayer');
      if (layer) {
        layer.classList.remove('in-modal');
        document.body.appendChild(layer);
      }
      migrateEffectClasses(false);
      gameModalOpen = false;
      const modal = document.getElementById('gameModal');
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      updateFsBtn();
      trackPresence('Browsing');
    }

    function toggleGameFullscreen() {
      const modal = document.getElementById('gameModal');
      if (!modal) return;
      try {
        if (document.fullscreenElement) {
          if (document.exitFullscreen) {
            const p = document.exitFullscreen();
            if (p && p.catch) p.catch(() => {});
          }
        } else if (modal.requestFullscreen) {
          const p = modal.requestFullscreen();
          if (p && p.catch) p.catch(() => {});
        }
      } catch (e) { console.error('fullscreen failed:', e); }
    }

    function updateFsBtn() {
      const b = document.getElementById('gameFsBtn');
      if (!b) return;
      const fs = !!document.fullscreenElement;
      b.textContent = fs ? '🗗' : '⛶';
      b.setAttribute('aria-label', fs ? 'Exit fullscreen' : 'Enter fullscreen');
    }

    // Native fullscreen-exit (Escape key, browser gesture) closes the game.
    document.addEventListener('fullscreenchange', () => {
      updateFsBtn();
      if (!document.fullscreenElement && gameModalOpen) closeGame();
    });

    /* ---------- Direct messages (admin ↔ you) ---------- */

    function toggleDm() {
      const panel = document.getElementById('dmPanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) {
        document.getElementById('dmDot').classList.remove('show');
        markDmsRead();
      }
    }

    function appendDm(msg) {
      const box = document.getElementById('dmMsgs');
      const empty = box.querySelector('.chat-empty');
      if (empty) empty.remove();
      const div = document.createElement('div');
      const isAdmin = (msg.from_username || '').toLowerCase() === 'admin';
      div.className = 'chat-msg' + (isAdmin ? ' admin' : '');
      div.innerHTML =
        '<div class="meta"><strong></strong> · <span></span></div>' +
        '<div class="bubble"></div>';
      div.querySelector('strong').textContent = msg.from_username || 'admin';
      div.querySelector('.meta span').textContent = msg.created_at ? formatTime(msg.created_at) : '';
      div.querySelector('.bubble').textContent = msg.content || '';
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function markDmsRead() {
      try {
        const { error } = await sb
          .from('direct_messages')
          .update({ read: true })
          .eq('to_username', myName)
          .eq('read', false);
        if (error) throw error;
      } catch (e) {
        console.error(e);
      }
    }

    async function loadDms() {
      try {
        // History in either direction between me and admin. Two exact-match
        // queries merged client-side (avoids filter-escaping issues with
        // freeform usernames).
        const [a, b] = await Promise.all([
          sb.from('direct_messages')
            .select('id, from_username, to_username, content, created_at, read')
            .eq('from_username', 'admin')
            .eq('to_username', myName)
            .order('created_at', { ascending: true })
            .limit(50),
          sb.from('direct_messages')
            .select('id, from_username, to_username, content, created_at, read')
            .eq('from_username', myName)
            .eq('to_username', 'admin')
            .order('created_at', { ascending: true })
            .limit(50)
        ]);
        if (a.error) throw a.error;
        if (b.error) throw b.error;
        const data = (a.data || []).concat(b.data || [])
          .sort((x, y) => new Date(x.created_at) - new Date(y.created_at))
          .slice(0, 50);
        const box = document.getElementById('dmMsgs');
        box.innerHTML = '';
        if (!data || data.length === 0) {
          box.innerHTML = '<div class="chat-empty">No messages yet.</div>';
        } else {
          data.forEach(appendDm);
          if (data.some(m => m.to_username === myName && !m.read)) {
            document.getElementById('dmDot').classList.add('show');
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function subscribeDms() {
      sb.channel('ls-dm-' + myName)
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: 'to_username=eq.' + myName },
          payload => {
            appendDm(payload.new);
            // Popup: open the panel and flag the fab so it's noticed mid-game.
            document.getElementById('dmPanel').classList.add('open');
            document.getElementById('dmDot').classList.add('show');
          })
        .subscribe();
    }

    async function sendDmReply(e) {
      e.preventDefault();
      const input = document.getElementById('dmInput');
      const content = input.value.trim();
      if (!content) return false;
      input.value = '';
      try {
        const { error } = await sb
          .from('direct_messages')
          .insert({ from_username: myName, to_username: 'admin', content: content.slice(0, 500) });
        if (error) throw error;
        // Echo optimistically (Realtime only fires for rows addressed to me).
        appendDm({ from_username: myName, content, created_at: new Date().toISOString() });
      } catch (err) {
        console.error(err);
        input.value = content;
      }
      return false;
    }

    function prettyName(path) {
      const base = path.split('/').pop();
      const key = base.toLowerCase();
      if (NAME_OVERRIDES[key]) return NAME_OVERRIDES[key];
      return base.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function emojiFor(path, i) {
      return EMOJIS[i % EMOJIS.length];
    }

    // Favorites live in localStorage (personal, per device).
    let favOnly = false;
    function getFavs() {
      try { return JSON.parse(localStorage.getItem('ls_favs') || '[]'); }
      catch (e) { return []; }
    }
    function isFav(path) { return getFavs().indexOf(path) !== -1; }
    function toggleFav(path, ev) {
      if (ev) ev.stopPropagation();
      let favs = getFavs();
      const i = favs.indexOf(path);
      if (i === -1) favs.push(path); else favs.splice(i, 1);
      try { localStorage.setItem('ls_favs', JSON.stringify(favs)); } catch (e) {}
      renderGames(document.getElementById('search').value);
    }
    function toggleFavFilter() {
      favOnly = !favOnly;
      document.getElementById('favFilterBtn').classList.toggle('active', favOnly);
      renderGames(document.getElementById('search').value);
    }

    function renderGames(filter = '') {
      const grid = document.getElementById('gamesGrid');
      const q = filter.trim().toLowerCase();
      grid.innerHTML = '';
      const favs = getFavs();
      const list = GAMES
        .filter(p => prettyName(p).toLowerCase().includes(q) || p.toLowerCase().includes(q))
        .filter(p => !favOnly || favs.indexOf(p) !== -1)
        .sort((a, b) => prettyName(a).localeCompare(prettyName(b)));
      const rc = document.getElementById('resultCount');
      if (rc) rc.textContent = list.length + (list.length === 1 ? ' game' : ' games') + (favOnly ? ' ★' : '');
      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px 16px;color:#6b6b8a;font-size:14px">🎮 No games found — try a different search.</div>';
        return;
      }
      list
        .forEach((path, i) => {
          const name = prettyName(path);
          const card = document.createElement('div');
          card.className = 'game-card';
          card.onclick = () => { openGame(path, name); };
          const star = document.createElement('button');
          star.className = 'fav-star' + (favs.indexOf(path) !== -1 ? ' on' : '');
          star.textContent = '★';
          star.setAttribute('aria-label', 'Favorite ' + name);
          star.onclick = ev => toggleFav(path, ev);
          const info = document.createElement('div');
          info.className = 'game-info';
          const h = document.createElement('h3');
          h.textContent = name;
          const tag = document.createElement('span');
          tag.className = 'game-tag';
          tag.textContent = 'Play';
          info.appendChild(h);
          info.appendChild(tag);
          const thumb = document.createElement('div');
          thumb.className = 'game-thumb';
          thumb.textContent = emojiFor(path, GAMES.indexOf(path));
          card.appendChild(thumb);
          card.appendChild(info);
          card.appendChild(star);
          grid.appendChild(card);
        });
    }

    function filterGames() {
      renderGames(document.getElementById('search').value);
    }

    renderGames();

      const me = await checkAuth();
      if (me) {

        startHeartbeat();

        const dp = document.getElementById('dmPanel');

        if (dp) dp.classList.remove('open');
