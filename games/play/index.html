<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lightspeed — Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #080810;
      min-height: 100vh;
      color: #fff;
    }

    /* Background blobs */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.2;
    }
    .blob1 { width: 560px; height: 560px; background: #7c3aed; top: -170px; left: -170px; }
    .blob2 { width: 460px; height: 460px; background: #2563eb; bottom: -120px; right: -120px; }

    /* NAV */
    nav {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 60px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(10,10,22,0.55);
      backdrop-filter: blur(28px) saturate(1.5);
      -webkit-backdrop-filter: blur(28px) saturate(1.5);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), 0 8px 32px rgba(0,0,0,0.35);
    }

    .nav-logo {
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-user {
      font-size: 13px;
      color: #9ca3af;
    }

    .nav-user strong {
      color: #c4b5fd;
      font-weight: 600;
    }

    .logout-btn {
      background: linear-gradient(165deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 7px 14px;
      font-size: 13px;
      color: #9ca3af;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 2px 8px rgba(0,0,0,0.35);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .logout-btn:hover {
      background: linear-gradient(165deg, rgba(255,255,255,0.14), rgba(124,58,237,0.12));
      color: #fff;
      border-color: rgba(255,255,255,0.2);
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 4px 16px rgba(0,0,0,0.4);
    }

    /* MAIN */
    .main {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }

    .page-header p {
      font-size: 13px;
      color: #6b6b8a;
      margin-top: 4px;
    }
    .online-line { display: flex; align-items: center; font-size: 12px; color: #6b6b8a; margin-top: 8px; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; margin-right: 8px; }

    .search-wrap {
      margin-top: 16px;
    }

    .search-wrap input {
      width: 100%;
      max-width: 340px;
      background: linear-gradient(165deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      background-color: rgba(10,10,22,0.5);
      border: 1px solid rgba(255,255,255,0.11);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      color: #fff;
      outline: none;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 8px rgba(0,0,0,0.3);
      transition: border-color 0.3s cubic-bezier(0.22, 1.15, 0.36, 1), box-shadow 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }

    .search-wrap input::placeholder { color: #4b5563; }
    .search-wrap input:focus {
      border-color: rgba(124,58,237,0.65);
      box-shadow: 0 0 0 4px rgba(124,58,237,0.16), inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 20px rgba(124,58,237,0.2);
    }

    /* GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    /* GAME CARD */
    .game-card {
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 45%, rgba(124,58,237,0.06));
      background-color: rgba(14,14,26,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 22px;
      overflow: hidden;
      cursor: pointer;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 32px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(255,255,255,0.03);
      transition: all 0.32s cubic-bezier(0.22, 1.15, 0.36, 1);
      animation: cardIn 0.35s cubic-bezier(0.22, 1.15, 0.36, 1) backwards;
    }

    .game-card:hover {
      transform: translateY(-6px);
      border-color: rgba(139,92,246,0.5);
      background: linear-gradient(165deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03) 45%, rgba(124,58,237,0.14));
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 18px 48px rgba(0,0,0,0.5), 0 8px 32px rgba(124,58,237,0.25),
        inset 0 1px 0 rgba(255,255,255,0.22), inset 0 -1px 0 rgba(255,255,255,0.05);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .game-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1e1b4b, #1e3a5f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -12px 24px rgba(0,0,0,0.25);
    }

    .game-info {
      padding: 14px 16px;
    }

    .game-info h3 {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }

    .game-info p {
      font-size: 12px;
      color: #4b5563;
      line-height: 1.5;
    }

    .game-tag {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      background: linear-gradient(165deg, rgba(124,58,237,0.22), rgba(124,58,237,0.1));
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 20px;
      font-size: 11px;
      color: #a78bfa;
      font-weight: 500;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.14);
    }

    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 11px;
      color: #1f2937;
      padding: 40px 0 20px;
      letter-spacing: 0.5px;
    }

    /* CHAT WIDGET */
    .chat-fab {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 50;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 12px 32px rgba(124,58,237,0.5);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .chat-fab:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 4px rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 16px 40px rgba(124,58,237,0.6);
    }
    .chat-fab:active { transform: scale(0.96); }

    .chat-panel {
      position: fixed;
      right: 22px;
      bottom: 86px;
      z-index: 50;
      width: 320px;
      max-height: 440px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 45%, rgba(124,58,237,0.06));
      background-color: rgba(17,17,24,0.6);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 48px rgba(0,0,0,0.55), 0 32px 96px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -1px 0 rgba(255,255,255,0.04);
    }
    .chat-panel.open {
      display: flex;
      animation: panelIn 0.32s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    @keyframes panelIn {
      from { opacity: 0; transform: translateY(12px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .chat-head {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-head small {
      font-weight: 400;
      color: #4b5563;
      font-size: 11px;
    }

    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 200px;
      max-height: 300px;
    }

    .chat-msg { font-size: 12.5px; line-height: 1.45; }
    .chat-msg .meta {
      font-size: 10.5px;
      color: #6b7280;
      margin-bottom: 2px;
    }
    .chat-msg .meta strong { color: #a78bfa; font-weight: 600; }
    .chat-msg.admin .meta strong { color: #f472b6; }
    .chat-msg .bubble {
      display: inline-block;
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 7px 10px;
      color: #e5e7eb;
      word-break: break-word;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .chat-empty {
      text-align: center;
      font-size: 12px;
      color: #4b5563;
      padding: 24px 0;
    }

    .chat-form {
      display: flex;
      gap: 8px;
      padding: 10px;
      border-top: 1px solid rgba(255,255,255,0.07);
    }
    .chat-form input {
      flex: 1;
      background: linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      background-color: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 13px;
      color: #fff;
      outline: none;
      transition: border-color 0.3s cubic-bezier(0.22, 1.15, 0.36, 1), box-shadow 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .chat-form input:focus {
      border-color: rgba(124,58,237,0.65);
      box-shadow: 0 0 0 4px rgba(124,58,237,0.16), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .chat-form button {
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 14px;
      padding: 0 14px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), 0 2px 6px rgba(0,0,0,0.4), 0 6px 20px rgba(124,58,237,0.4);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .chat-form button:hover {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      transform: translateY(-1px);
    }
    .chat-form button:active { transform: scale(0.97); }

    /* ADMIN FAB (visible to admins only) */
    .admin-fab {
      position: fixed;
      top: 76px;
      right: 22px;
      z-index: 50;
      display: none;
      padding: 8px 14px;
      border-radius: 22px;
      background: linear-gradient(165deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
      background-color: rgba(17,17,24,0.6);
      border: 1px solid rgba(124,58,237,0.45);
      backdrop-filter: blur(28px) saturate(1.5);
      -webkit-backdrop-filter: blur(28px) saturate(1.5);
      color: #c4b5fd;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 2px 6px rgba(0,0,0,0.4), 0 10px 28px rgba(0,0,0,0.45);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .admin-fab:hover {
      border-color: rgba(139,92,246,0.8);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 2px 6px rgba(0,0,0,0.4), 0 12px 32px rgba(124,58,237,0.4);
    }
    .admin-fab.show { display: inline-block; }

    /* DM WIDGET (bottom-left, separate from global chat) */
    .dm-fab {
      position: fixed;
      left: 22px;
      bottom: 22px;
      z-index: 50;
      width: 52px;
      height: 52px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), inset 0 -2px 4px rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 12px 32px rgba(124,58,237,0.5);
      transition: all 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .dm-fab:hover {
      transform: scale(1.08);
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 4px rgba(0,0,0,0.2),
        0 2px 6px rgba(0,0,0,0.4), 0 16px 40px rgba(124,58,237,0.6);
    }
    .dm-fab:active { transform: scale(0.96); }
    .dm-dot {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f472b6;
      border: 2px solid #080810;
      display: none;
    }
    .dm-dot.show { display: block; }

    .dm-panel {
      position: fixed;
      left: 22px;
      bottom: 86px;
      z-index: 50;
      width: 320px;
      max-height: 440px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(165deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 45%, rgba(244,114,182,0.06));
      background-color: rgba(17,17,24,0.6);
      border: 1px solid rgba(244,114,182,0.3);
      border-radius: 22px;
      backdrop-filter: blur(32px) saturate(1.5);
      -webkit-backdrop-filter: blur(32px) saturate(1.5);
      box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 48px rgba(0,0,0,0.55), 0 32px 96px rgba(0,0,0,0.3),
        inset 0 1px 0 rgba(255,255,255,0.16), inset 0 -1px 0 rgba(255,255,255,0.04);
    }
    .dm-panel.open {
      display: flex;
      animation: panelIn 0.32s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    .dm-note {
      padding: 8px 14px;
      font-size: 11px;
      color: #6b7280;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }

    /* TROLL LAYER (transient admin effects, all self-clearing) */
    #trollLayer {
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: none;
      overflow: hidden;
    }
    .troll-full {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: rgba(8,8,16,0.92);
      color: #fff;
      text-align: center;
      padding: 24px;
    }
    .troll-full img {
      max-width: 92vw;
      max-height: 70vh;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 24px 80px rgba(0,0,0,0.7);
    }
    .troll-flash { animation: trollFlash 0.28s linear 7; }
    @keyframes trollFlash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    body.troll-shake { animation: trollShake 0.45s linear 6; }
    @keyframes trollShake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-8px, 4px) rotate(-0.6deg); }
      40% { transform: translate(7px, -5px) rotate(0.6deg); }
      60% { transform: translate(-5px, -3px) rotate(-0.4deg); }
      80% { transform: translate(6px, 5px) rotate(0.4deg); }
    }
    body.troll-flip {
      transform: rotate(180deg);
      transition: transform 0.5s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    body.troll-invert { filter: invert(1); }
    .troll-spin {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #a78bfa;
      animation: trollSpin 0.9s linear infinite;
    }
    @keyframes trollSpin { to { transform: rotate(360deg); } }
    .troll-title { font-size: 17px; font-weight: 700; }
    .troll-sub { font-size: 13px; color: #9ca3af; }
    .troll-ripple {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: trollRipple 1s ease-out forwards;
    }
    @keyframes trollRipple {
      from { opacity: 0.9; scale: 0.4; }
      to { opacity: 0; scale: 5; }
    }
    .troll-toast {
      position: absolute;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      max-width: 86vw;
      background: rgba(17,17,24,0.92);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 12px 18px;
      font-size: 14px;
      color: #fff;
      text-align: center;
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      box-shadow: 0 12px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.16);
      animation: toastIn 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .troll-confetti {
      position: absolute;
      top: -16px;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      to { transform: translateY(110vh) rotate(720deg); }
    }
    /* Fake iOS alert (obvious joke, OK button dismisses) */
    .ios-alert-back {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      pointer-events: auto;
      padding: 24px;
    }
    .ios-alert {
      width: 270px;
      max-width: 80vw;
      background: rgba(242,242,247,0.94);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border-radius: 14px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      animation: panelIn 0.3s cubic-bezier(0.22, 1.15, 0.36, 1);
      pointer-events: auto;
    }
    .ios-alert h3 {
      font-size: 17px;
      font-weight: 600;
      color: #000;
      padding: 18px 16px 6px;
    }
    .ios-alert p {
      font-size: 13px;
      color: #000;
      padding: 0 16px 16px;
      line-height: 1.4;
    }
    .ios-alert button {
      width: 100%;
      min-height: 44px;
      border: none;
      border-top: 1px solid rgba(0,0,0,0.12);
      background: transparent;
      color: #007aff;
      font-size: 17px;
      font-weight: 400;
      cursor: pointer;
    }
    .ios-alert button:active { background: rgba(0,0,0,0.06); }

    /* ===== FLAT DESIGN OVERRIDE (no glow, no blur, no shadow) ===== */
    body { background: #0a0a0f !important; color: #e2e2f0 !important; animation: pageIn 0.3s ease-out; }
    @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .bg, .blob { display: none !important; }
    * { text-shadow: none !important; }
    nav {

    .arow { animation: itemIn 0.3s ease-out backwards; }

    /* PINNED ANNOUNCEMENTS (separate from chat, above the games) */

<body>

  <div class="bg">
    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
  </div>

  <nav>
    <div class="nav-logo">⚡ Lightspeed</div>
    <div class="nav-right">
      <span class="nav-user" id="navUser"></span>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </nav>

  <div id="announceBar" style="display:none" aria-live="polite"></div>

  <div class="main">
    <div id="reqBanner" aria-live="polite"></div>
    <div class="page-header">
      <h1>Games</h1>
      <p>Pick a game and get playing.</p>
      <p class="online-line"><span class="online-dot"></span><span id="onlineCount">…</span>&nbsp;online</p>
      <div class="search-wrap">
        <input id="search" type="text" placeholder="Search games..." oninput="filterGames()" />
      </div>
    </div>

    <div class="games-grid" id="gamesGrid">
    </div>
  </div>

  <footer>LIGHTSPEED &copy; 2026</footer>

  <!-- ADMIN (shown only when the logged-in user is_admin) -->
  <a class="admin-fab" id="adminFab" href="../../admin/index.html">⚙ Admin Panel</a>

  <!-- GLOBAL CHAT -->
  <button class="chat-fab" id="chatFab" onclick="toggleChat()" title="Global chat">💬</button>
  <div class="chat-panel" id="chatPanel">
    <div class="chat-head">
      <span>Global Chat</span>
      <small id="chatStatus">connecting…</small>
    </div>
    <div class="chat-msgs" id="chatMsgs">
      <div class="chat-empty">Loading messages…</div>
    </div>
    <div class="reply-bar" id="replyBar">
      <span>↩</span><span class="preview" id="replyPreview"></span>
      <button onclick="cancelReply()" aria-label="Cancel reply">✕</button>
    </div>
    <form class="chat-form" onsubmit="return sendChat(event)">
      <input id="chatInput" type="text" placeholder="Say something…" maxlength="500" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- DIRECT MESSAGES (admin ↔ you, separate from global chat) -->
  <button class="dm-fab" id="dmFab" onclick="toggleDm()" title="Messages from admin">✉️<span class="dm-dot" id="dmDot"></span></button>
  <div class="chat-panel dm-panel" id="dmPanel">
    <div class="chat-head">
      <span>Admin DMs</span>
      <small id="dmStatus">live</small>
    </div>
    <div class="dm-note">Only you and the admin see this thread.</div>
    <div class="chat-msgs" id="dmMsgs">
      <div class="chat-empty">No messages yet.</div>
    </div>
    <form class="chat-form" onsubmit="return sendDmReply(event)">
      <input id="dmInput" type="text" placeholder="Reply to admin…" maxlength="500" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- APPROVED MODAL (pops like the request form) -->
  <div class="overlay" id="approvedOverlay" onclick="if(event.target===this)closeApprovedModal()">
    <div class="modal">
      <h2>Request Approved! 🎉</h2>
      <p>Use this key to log in:</p>
      <div class="keyline"><span id="playKeyText"></span><button class="mini-btn" onclick="copyPlayKey()">Copy</button></div>
      <div style="margin-top:14px"><button class="mini-btn" onclick="closeApprovedModal()">Done</button></div>
    </div>
  </div>

  <!-- TROLL LAYER (transient admin effects render here, then self-clear) -->
  <div id="trollLayer" aria-hidden="true"></div>
  <div id="toastWrap" aria-live="polite"></div>
  <audio id="trollAudio" preload="auto"></audio>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Fill these in (same values as games/index.html) ─────────────
    const SUPABASE_URL = "https://hqjclkkwsepdhtwnwsvp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxamNsa2t3c2VwZGh0d253c3ZwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxOTY5NTMsImV4cCI6MjEwNTc3Mjk1M30.-OXxTRYmIi4snwJSiThFsAPr5YgVbwz4kwUY_DURFRA";
    // ───────────────────────────────────────────────────────────────

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const LS_TOKEN = 'ls_session_token';
    const LS_USER = 'ls_username';
    const LS_RANK = 'user_rank';

    function toast(msg, kind) {
      const wrap = document.getElementById('toastWrap');
      if (!wrap) return;
      const t = document.createElement('div');
      t.className = 'toast' + (kind === 'err' ? ' err' : kind === 'ok' ? ' ok' : '');
      t.textContent = msg;
      wrap.appendChild(t);
      setTimeout(() => {
        if (!t.parentNode) return;
        t.classList.add('out');
        setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 200);
      }, 3000);
    }

    function escPlay(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    // Reply state: { id, username, preview } or null.
    let replyTo = null;

    function myRank() {
      try { return localStorage.getItem(LS_RANK) || 'user'; } catch (e) { return 'user'; }
    }

    function rankBadgeHtml(rank) {
      if (rank === 'owner') return '<span class="rank-badge rank-owner">OWNER</span>';
      if (rank === 'admin') return '<span class="rank-badge rank-admin">ADMIN</span>';
      if (rank === 'mod') return '<span class="rank-badge rank-mod">MOD</span>';
      return '';
    }

    function logout() {
      localStorage.removeItem(LS_TOKEN);
      localStorage.removeItem(LS_USER);
      try { sessionStorage.removeItem('ls_auth'); } catch (e) {}
      window.location.href = '../index.html';
    }

    // Validate the stored session token against Supabase.
    // Redirects to the login page if missing, revoked, or deactivated.
    async function checkAuth() {
      const token = localStorage.getItem(LS_TOKEN);
      if (!token) {
        window.location.href = '../index.html';
        return null;
      }
      try {
        const { data, error } = await sb
          .from('license_keys')
          .select('id, is_active, is_admin, rank, username, used_by')
          .eq('session_token', token)
          .maybeSingle();
        if (error) throw error;
        if (!data || !data.is_active) {
          logout();
          return null;
        }
        const name = localStorage.getItem(LS_USER) || data.used_by || data.username || 'player';
        const rank = data.rank || (data.is_admin ? 'admin' : 'user');
        try { localStorage.setItem(LS_RANK, rank); } catch (e) {}
        document.getElementById('navUser').innerHTML =
          'Signed in as <strong></strong>';
        document.getElementById('navUser').querySelector('strong').textContent = name;
        const badge = document.createElement('span');
        badge.innerHTML = rankBadgeHtml(rank);
        document.getElementById('navUser').appendChild(badge);
        const elevated = rank === 'owner' || rank === 'admin' || rank === 'mod';
        if (data.is_admin || elevated) {
          document.getElementById('adminFab').classList.add('show');
        }
        return data;
      } catch (e) {
        console.error(e);
        // Don't hard-redirect on transient network errors: show games but
        // block chat until auth can be confirmed on next load.
        document.getElementById('navUser').textContent = '';
        return null;
      }
    }

    /* ---------- Global chat (messages table + Realtime) ---------- */

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function formatTime(iso) {
      try {
        return new Date(iso).toLocaleString([], {
          month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch (e) { return ''; }
    }

    function appendMessage(msg, delayMs) {
      const box = document.getElementById('chatMsgs');
      const empty = box.querySelector('.chat-empty');
      if (empty) empty.remove();
      const div = document.createElement('div');
      const uname = (msg.username || 'anon');
      const isAdmin = uname.toLowerCase() === 'admin' || msg.rank === 'admin' || msg.rank === 'owner';
      div.className = 'chat-msg' + (isAdmin ? ' admin' : '');
      if (delayMs) div.style.animationDelay = delayMs + 'ms';
      div.setAttribute('data-mid', msg.id || '');
      div.setAttribute('data-user', uname);
      const meta = document.createElement('div');
      meta.className = 'meta';
      const strong = document.createElement('strong');
      strong.textContent = uname;
      meta.appendChild(strong);
      const badgeSpan = document.createElement('span');
      badgeSpan.innerHTML = rankBadgeHtml(msg.rank);
      meta.appendChild(badgeSpan);
      const time = document.createElement('span');
      time.textContent = (msg.created_at ? ' · ' + formatTime(msg.created_at) : '');
      meta.appendChild(time);
      const replyBtn = document.createElement('button');
      replyBtn.className = 'reply-btn';
      replyBtn.textContent = '↩';
      replyBtn.title = 'Reply';
      replyBtn.setAttribute('aria-label', 'Reply to ' + uname);
      replyBtn.onclick = () => startReply(msg.id, uname, msg.content || '');
      meta.appendChild(replyBtn);
      div.appendChild(meta);
      // Quoted reply preview, if this message is a reply.
      const replyUser = msg.reply_username || null;
      const replyPrev = msg.reply_preview || null;
      if (replyPrev) {
        const q = document.createElement('div');
        q.className = 'quote-block';
        const qs = document.createElement('strong');
        qs.textContent = replyUser || 'someone';
        q.appendChild(qs);
        q.appendChild(document.createTextNode(': ' + replyPrev));
        div.appendChild(q);
      }
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = msg.content || '';
      div.appendChild(bubble);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function startReply(id, username, content) {
      replyTo = { id: id || null, username: username, preview: String(content || '').slice(0, 60) };
      const bar = document.getElementById('replyBar');
      const prev = document.getElementById('replyPreview');
      if (prev) prev.textContent = 'Replying to ' + username + ': ' + replyTo.preview;
      if (bar) bar.classList.add('show');
      const input = document.getElementById('chatInput');
      if (input) input.focus();
    }

    function cancelReply() {
      replyTo = null;
      const bar = document.getElementById('replyBar');
      if (bar) bar.classList.remove('show');
    }

    async function loadChat() {
      const box = document.getElementById('chatMsgs');
      box.innerHTML = '<div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div><div class="skel" style="height:44px"></div>';
      try {
        let res = await sb
          .from('messages')
          .select('id, username, content, created_at, rank, reply_to, reply_preview, reply_username')
          .order('created_at', { ascending: true })
          .limit(50);
        if (res.error && /column/i.test(res.error.message || '')) {
          // Older schema without the new columns — fall back to base fields.
          res = await sb
            .from('messages')
            .select('id, username, content, created_at')
            .order('created_at', { ascending: true })
            .limit(50);
        }
        const { data, error } = res;

        box.innerHTML = '';

          box.innerHTML = '<div class="chat-empty">💬 No messages yet — say hi.</div>';
        } else {

        console.error(e);
        document.getElementById('chatMsgs').innerHTML =

    async function sendChat(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const status = document.getElementById('chatStatus');
      const content = input.value.trim();
      if (!content) return false;
      const username = (localStorage.getItem(LS_USER) || 'anon').slice(0, 32);
      try {
        // Re-check blacklist on every send — a login-time check can go
        // stale if the user is blacklisted mid-session. If this select
        // fails on a transient network error we still attempt the insert
        // below, which restores the input on failure.
        const { data: banned, error: banErr } = await sb
          .from('blacklist')
          .select('id')
          .eq('username', username)
          .limit(1);
        if (!banErr && banned && banned.length > 0) {
          status.textContent = 'blocked';
          return false;
        }
      } catch (err) {
        console.error(err);
      }
      input.value = '';
      const sendBtn = document.querySelector('.chat-form button[type="submit"]');
      if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = '…'; }
      try {
        const payload = { username, content: content.slice(0, 500), rank: myRank() };
        if (replyTo && replyTo.id) {
          payload.reply_to = replyTo.id;
          payload.reply_preview = replyTo.preview;
          payload.reply_username = replyTo.username;
        }
        let { error } = await sb
          .from('messages')
          .insert(payload);
        if (error && (payload.rank !== undefined || payload.reply_username !== undefined)) {
          // Older schema without the new columns — retry with base fields.
          const slim = { username: payload.username, content: payload.content };
          if (payload.reply_to !== undefined) {
            slim.reply_to = payload.reply_to;
            slim.reply_preview = payload.reply_preview;
          }
          const r2 = await sb.from('messages').insert(slim);
          error = r2.error;
        }
        if (error) throw error;
        cancelReply();
        if (status.textContent === 'blocked') status.textContent = 'live';
      } catch (err) {
        console.error(err);
        input.value = content; // restore so the user doesn't lose it
        toast('Send failed', 'err');
      } finally {
        if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = 'Send'; }
      }
      return false;
    }

    /* ---------- Troll events (transient admin effects) ---------- */

    let trollAudioCtx = null;

    // iOS Safari blocks audio until a user gesture. Unlock on first tap
    // (touchend for iPad, pointerdown for everything else). Visuals never
    // depend on sound succeeding.
    function registerTrollUnlock() {
      const unlock = () => {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            if (!trollAudioCtx) trollAudioCtx = new AC();
            if (trollAudioCtx.state === 'suspended') trollAudioCtx.resume();
          }
          const el = document.getElementById('trollAudio');
          if (el) {
            const p = el.play();
            if (p && p.catch) p.catch(() => {});
          }
        } catch (e) { /* visual effects must work regardless */ }
      };
      window.addEventListener('touchend', unlock, { once: true, passive: true });
      window.addEventListener('pointerdown', unlock, { once: true });
    }

    // Short synthesized scare burst (no audio file needed). Best effort.
    function scareSound() {
      try {
        if (!trollAudioCtx || trollAudioCtx.state !== 'running') return;
        const ctx = trollAudioCtx;
        const t = ctx.currentTime;
        [110, 116.5, 123.5].forEach((f, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.type = 'sawtooth';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.25, t + 0.05 + i * 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
          o.connect(g).connect(ctx.destination);
          o.start(t);
          o.stop(t + 1.5);
        });
      } catch (e) { /* silent — visual still plays */ }
    }

    function trollLayer() { return document.getElementById('trollLayer'); }

    function clearAfter(el, ms) {
      setTimeout(() => { if (el && el.parentNode) el.parentNode.removeChild(el); }, ms);
    }

    // Persistent jumpscare: flashes the image (fade-in 0.3s, hold 1.5s,
    // fade-out 0.5s), then repeats every 8–15s randomised until stopped.
    function startJumpscare(payload) {
      const layer = trollLayer();
      const img = (payload && payload.image) || 'scare1.jpg';
      const safe = /^scare[1-3]\.jpg$/.test(img) ? img : 'scare1.jpg';
      let box = null;
      let alive = true;
      let timer = null;
      function flash() {
        if (!alive) return;
        box = document.createElement('div');
        box.className = 'troll-full';
        box.style.transition = 'opacity 0.3s';
        box.style.opacity = '0';
        const pic = document.createElement('img');
        pic.src = '../../admin/' + safe;
        pic.alt = '';
        pic.className = 'troll-flash';
        pic.onerror = () => {
          console.error('jumpscare image failed to load:', pic.src);
          pic.style.display = 'none';
          const big = document.createElement('div');
          big.style.fontSize = '96px';
          big.textContent = '👹';
          big.className = 'troll-flash';
          box.insertBefore(big, box.firstChild);
        };
        box.appendChild(pic);
        layer.appendChild(box);
        requestAnimationFrame(() => { if (box) box.style.opacity = '1'; });
        scareSound();
        setTimeout(() => { if (!alive || !box) return; box.style.transition = 'opacity 0.5s'; box.style.opacity = '0'; }, 1800);
        setTimeout(() => { if (box && box.parentNode) box.parentNode.removeChild(box); box = null; }, 2400);
        const next = 8000 + Math.random() * 7000; // 8–15s
        timer = setTimeout(flash, next);
      }
      flash();
      return () => {
        alive = false;
        if (timer) clearTimeout(timer);
        if (box && box.parentNode) box.parentNode.removeChild(box);
        box = null;
      };
    }

    // Persistent tricks: start() shows the effect and returns a stop()
    // function. They run until an "off" event (or page reload) stops them.
    function startShake() {

    function startRipples() {
      const layer = trollLayer();
      const hues = [265, 210, 320, 180, 0, 45];
      let n = 0;
      // Runs forever until stop() — spawned nodes self-remove, so only a

    function effectConfetti() {
      const layer = trollLayer();
      const colors = ['#a78bfa', '#60a5fa', '#f472b6', '#34d399', '#fbbf24', '#f87171'];
      for (let i = 0; i < 80; i++) {

    // Persistent tricks stay running until an "off" event for the same
    // trick + scope arrives (scope = global '*' or one specific user).
    // Instant tricks (confetti, popups, alert) always fire once.
    const PERSISTENT_TRICKS = ['jumpscare', 'shake', 'disconnect', 'flip', 'ripples', 'invert', 'loading'];
    const activeTricks = {}; // "type|scope" -> { stop }

    function stopTrick(key) {
      const t = activeTricks[key];
      if (!t) return;
      delete activeTricks[key];
      try { t.stop(); } catch (e) { console.error('trick stop failed:', e); }
    }

    function startPersistent(type, payload) {
      switch (type) {
        case 'jumpscare': return startJumpscare(payload || {});
        case 'shake': return startShake();
        case 'disconnect': return startDisconnect();
        case 'flip': return startFlip();
        case 'ripples': return startRipples();
        case 'invert': return startInvert();
        case 'loading': return startLoading();
        default: return null;
      }
    }

    function dispatchTroll(row) {
      let me = 'anon';
      try { me = (localStorage.getItem(LS_USER) || myName || 'anon').slice(0, 32); } catch (e) {}
      if (row.target_username && row.target_username !== me) return; // not for me
      const scope = row.target_username || '*';
      const key = row.event_type + '|' + scope;
      const state = row.payload && row.payload.state;
      if (PERSISTENT_TRICKS.indexOf(row.event_type) !== -1) {
        if (state === 'off') { stopTrick(key); return; }
        stopTrick(key); // restart cleanly if already running
        const stop = startPersistent(row.event_type, row.payload || {});
        if (!stop) return;
        activeTricks[key] = { stop: stop };
        // Runs forever until an "off" event (or page reload). No timers.
        return;
      }
      const payload = row.payload || {};
      switch (row.event_type) {
        case 'confetti': effectConfetti(); break;
        case 'popups': effectPopups(payload); break;
        case 'alert': effectAlert(payload); break;
        default: console.error('unknown trick:', row.event_type);
      }
    }

    // On page load, fetch the latest row per event_type for both scopes
    // (global '*' and this user). Newest 'on' wins: the effect starts and
    // runs forever until an 'off' arrives. All fetched ids are marked seen
    // so the 3s poll never re-fires old one-shot effects.
    async function resumeActiveTricks() {
      let me = 'anon';
      try { me = (localStorage.getItem(LS_USER) || myName || 'anon').slice(0, 32); } catch (e) {}
      try {
        const { data, error } = await sb
          .from('troll_events')
          .select('id, event_type, target_username, payload, created_at')
          .order('created_at', { ascending: false })
          .limit(200);
        if (error) throw error;
        const decided = {};
        (data || []).forEach(r => {
          if (r.target_username && r.target_username !== me) return;
          markTrollSeen(r);
          const scope = r.target_username || '*';
          const k = r.event_type + '|' + scope;
          if (k in decided) return;
          decided[k] = true;
          const st = r.payload && r.payload.state;
          if (PERSISTENT_TRICKS.indexOf(r.event_type) !== -1 && st === 'on') {
            try { dispatchTroll(r); } catch (e) { console.error('resume trick failed:', e); }
          }
        });
      } catch (e) {
        console.error('resume tricks failed:', e);
      }
    }

    /* ---------- Key request status banner (same as login page) ---------- */

    async function checkPlayRequestStatus() {
      const wrap = document.getElementById('reqBanner');
      if (!wrap) return;
      let name = null;
      try { name = localStorage.getItem('pending_request_name'); } catch (e) {}
      if (!name) { wrap.innerHTML = ''; return; }
      let dismissed = null;
      try { dismissed = localStorage.getItem('request_dismissed_' + name); } catch (e) {}
      try {
        const { data, error } = await sb
          .from('key_requests')
          .select('id, name, status')

          .order('id', { ascending: false })
          .limit(1)
          .maybeSingle();
        if (error) throw error;
        if (!data) { wrap.innerHTML = ''; return; }
        if (data.status === 'denied') {

            '<div style="margin-top:10px"><button class="mini-btn ghost" onclick="dismissPlayBanner()">Dismiss</button></div></div>';
        } else if (data.status === 'approved') {

              .from('license_keys')
              .select('plaintext_reveal')
              .eq('request_id', data.id)
              .order('id', { ascending: false })
              .limit(1)
              .maybeSingle();
            if (!kerr && krow && krow.plaintext_reveal) keyText = krow.plaintext_reveal;

    // Seen event ids — realtime marks them on arrival, the initial sync
    // seeds them, and the 3s poll only dispatches ids never seen before.
    // This keeps effects running forever without restart flicker.
    const trollSeen = new Set();
    function markTrollSeen(row) {
      if (row && row.id !== undefined && row.id !== null) trollSeen.add('t' + row.id);
    }

    let trollChannel = null;
    function subscribeTrolls() {
      try {
        if (trollChannel) { try { sb.removeChannel(trollChannel); } catch (e) {} }
        trollChannel = sb.channel('ls-trolls')
          .on('postgres_changes',
            { event: 'INSERT', schema: 'public', table: 'troll_events' },
            payload => {
              try { markTrollSeen(payload.new); dispatchTroll(payload.new); }
              catch (e) { console.error('trick failed:', e); }
            })
          .subscribe();
      } catch (e) {
        console.error('troll realtime subscribe failed:', e);
      }
    }

    // Re-subscribe when the tab becomes visible again (mobile browsers
    // and flaky networks can silently drop realtime channels).
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        try { subscribeTrolls(); } catch (e) { console.error('troll resubscribe failed:', e); }
      }
    });

    // 3s fallback poll — catches events realtime missed. Only unseen ids
    // dispatch, so running effects are never restarted by the poll.
    async function pollTrolls() {
      let me = 'anon';
      try { me = (localStorage.getItem(LS_USER) || myName || 'anon').slice(0, 32); } catch (e) {}
      try {
        const { data, error } = await sb
          .from('troll_events')
          .select('id, event_type, target_username, payload, created_at')
          .order('id', { ascending: false })
          .limit(20);
        if (error) throw error;
        (data || []).slice().reverse().forEach(r => {
          if (r.target_username && r.target_username !== me) return;
          const k = 't' + r.id;
          if (trollSeen.has(k)) return;
          trollSeen.add(k);
          try { dispatchTroll(r); } catch (e) { console.error('trick failed:', e); }
        });
      } catch (e) {
        console.error('troll poll failed:', e);
      }
    }

    /* ---------- Announcements (pinned banner, separate from chat) ---------- */

    let announceSeenMax = 0;

    /* ---------- Heartbeat pollers (realtime + 3s fallback) ---------- */

    const pollers = {};
    function startPoller(name, fn, ms) {
      stopPoller(name);
      try { fn(); } catch (e) { console.error('poller ' + name + ' failed:', e); }
      pollers[name] = setInterval(fn, ms);
    }
    function stopPoller(name) {
      if (pollers[name]) { clearInterval(pollers[name]); delete pollers[name]; }
    }

    /* ---------- Presence (active_sessions) ---------- */

    let myName = 'anon';
    let heartbeatTimer = null;

    async function trackPresence(game) {

          .from('active_sessions')
          .upsert(
            { username: myName, current_game: game, last_seen: new Date().toISOString() },
            { onConflict: 'username' }
          );
        if (error) throw error;
      } catch (e) {
        console.error(e);
      }
    }

    function startHeartbeat() {
      // Refresh last_seen every 30s so admin can tell active vs stale.
      // Only the timestamp is rewritten; current_game is left as-is.
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        sb.from('active_sessions')
          .update({ last_seen: new Date().toISOString() })
          .eq('username', myName)
          .then(({ error }) => { if (error) console.error(error); });
      }, 30000);
    }

    // Cards route through here so the open is recorded before navigating.
    async function openGame(path, name) {
      await trackPresence(name);
      window.location.href = '../' + path + '/index.html';
    }

    /* ---------- Direct messages (admin ↔ you) ---------- */

    function toggleDm() {
      const panel = document.getElementById('dmPanel');
      panel.classList.toggle('open');
      if (panel.classList.contains('open')) {
        document.getElementById('dmDot').classList.remove('show');
        markDmsRead();
      }
    }

    function appendDm(msg) {
      const box = document.getElementById('dmMsgs');
      const empty = box.querySelector('.chat-empty');
      if (empty) empty.remove();
      const div = document.createElement('div');
      const isAdmin = (msg.from_username || '').toLowerCase() === 'admin';
      div.className = 'chat-msg' + (isAdmin ? ' admin' : '');
      div.innerHTML =
        '<div class="meta"><strong></strong> · <span></span></div>' +
        '<div class="bubble"></div>';
      div.querySelector('strong').textContent = msg.from_username || 'admin';
      div.querySelector('.meta span').textContent = msg.created_at ? formatTime(msg.created_at) : '';
      div.querySelector('.bubble').textContent = msg.content || '';
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function markDmsRead() {
      try {
        const { error } = await sb
          .from('direct_messages')
          .update({ read: true })
          .eq('to_username', myName)
          .eq('read', false);
        if (error) throw error;
      } catch (e) {
        console.error(e);
      }
    }

    async function loadDms() {
      try {
        // History in either direction between me and admin. Two exact-match
        // queries merged client-side (avoids filter-escaping issues with
        // freeform usernames).
        const [a, b] = await Promise.all([
          sb.from('direct_messages')
            .select('id, from_username, to_username, content, created_at, read')
            .eq('from_username', 'admin')
            .eq('to_username', myName)
            .order('created_at', { ascending: true })
            .limit(50),
          sb.from('direct_messages')
            .select('id, from_username, to_username, content, created_at, read')
            .eq('from_username', myName)
            .eq('to_username', 'admin')
            .order('created_at', { ascending: true })
            .limit(50)
        ]);
        if (a.error) throw a.error;
        if (b.error) throw b.error;
        const data = (a.data || []).concat(b.data || [])
          .sort((x, y) => new Date(x.created_at) - new Date(y.created_at))
          .slice(0, 50);
        const box = document.getElementById('dmMsgs');
        box.innerHTML = '';
        if (!data || data.length === 0) {
          box.innerHTML = '<div class="chat-empty">No messages yet.</div>';
        } else {
          data.forEach(appendDm);
          if (data.some(m => m.to_username === myName && !m.read)) {
            document.getElementById('dmDot').classList.add('show');
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function subscribeDms() {
      sb.channel('ls-dm-' + myName)
        .on('postgres_changes',
          { event: 'INSERT', schema: 'public', table: 'direct_messages', filter: 'to_username=eq.' + myName },
          payload => {
            appendDm(payload.new);
            // Popup: open the panel and flag the fab so it's noticed mid-game.
            document.getElementById('dmPanel').classList.add('open');
            document.getElementById('dmDot').classList.add('show');
          })
        .subscribe();
    }

    async function sendDmReply(e) {
      e.preventDefault();
      const input = document.getElementById('dmInput');
      const content = input.value.trim();
      if (!content) return false;
      input.value = '';
      try {
        const { error } = await sb
          .from('direct_messages')
          .insert({ from_username: myName, to_username: 'admin', content: content.slice(0, 500) });
        if (error) throw error;
        // Echo optimistically (Realtime only fires for rows addressed to me).
        appendDm({ from_username: myName, content, created_at: new Date().toISOString() });
      } catch (err) {
        console.error(err);
        input.value = content;
      }
      return false;
    }

    function prettyName(path) {
      const base = path.split('/').pop();
      const key = base.toLowerCase();
      if (NAME_OVERRIDES[key]) return NAME_OVERRIDES[key];
      return base.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    }

    function emojiFor(path, i) {
      return EMOJIS[i % EMOJIS.length];
    }

    function renderGames(filter = '') {
      const grid = document.getElementById('gamesGrid');
      const q = filter.trim().toLowerCase();
      grid.innerHTML = '';
      const list = GAMES
        .filter(p => prettyName(p).toLowerCase().includes(q) || p.toLowerCase().includes(q));
      if (list.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px 16px;color:#6b6b8a;font-size:14px">🎮 No games found — try a different search.</div>';
        return;
      }
      list
        .forEach((path, i) => {
          const name = prettyName(path);
          const card = document.createElement('div');
          card.className = 'game-card';
          card.onclick = () => { openGame(path, name); };
          card.innerHTML =
            '<div class="game-thumb">' + emojiFor(path, GAMES.indexOf(path)) + '</div>' +
            '<div class="game-info"><h3>' + name + '</h3>' +
            '<p>' + path + '</p>' +
            '<span class="game-tag">Play</span></div>';
          grid.appendChild(card);
        });
    }

    function filterGames() {
      renderGames(document.getElementById('search').value);
    }

    renderGames();
    (async () => {
      const me = await checkAuth();
      if (me) {
        myName = (localStorage.getItem(LS_USER) || me.used_by || me.username || 'anon').slice(0, 32);
        await trackPresence('Browsing');
        startHeartbeat();
        await loadDms();
        subscribeDms();
      }
      loadChat();
      subscribeChat();
      resumeActiveTricks();
      checkPlayRequestStatus();
      loadAnnouncements();
      subscribeAnnouncements();
      startPoller('trolls', pollTrolls, 3000);
      startPoller('announce', loadAnnouncements, 3000);
      startPoller('online', loadOnlineCount, 3000);
    })();

        const dp = document.getElementById('dmPanel');
        if (cp) cp.classList.remove('open');
        if (dp) dp.classList.remove('open');
